<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travel Signage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
color:white;
font-family:'Google Sans', Arial, Helvetica, sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
background:#111;
}

.travel-item{
  font-size:40px;
  margin:20px 0;
}

#box{
  z-index:2;
}

h1{
  font-size:70px;
  margin-bottom:40px;
}

#background{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-size:cover;
background-position:center;
z-index:0;
}

#overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:1;
}

/* debug */
#debug{
position:fixed;
bottom:10px;
left:10px;
font-size:12px;
color:#0f0;
background:rgba(0,0,0,0.7);
padding:10px;
max-width:500px;
white-space:pre-wrap;
z-index:9999;
}

</style>
</head>

<body>

<div id="background"></div>
<div id="overlay"></div>

<div id="box"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";
    
const mode = localStorage.getItem("travelMode");

if(mode === "weekend"){
  window.location.href = "travel-weekend.html";
}

let slides = [];
let currentSlide = 0;
let duration = 0;

// =========================
// BACKGROUND (from v1)
// =========================
async function setBackgroundBySun(){

  try{
    const res = await fetch(
      "https://api.sunrise-sunset.org/json?lat=52.1889&lng=0.9977&formatted=0"
    );

    const data = await res.json();

    const sunrise = new Date(data.results.sunrise);
    const sunset = new Date(data.results.sunset);
    const now = new Date();

    const bg = document.getElementById("background");

    if(now >= sunrise && now < sunset){
      bg.style.backgroundImage =
        "url('https://totalmixcreative.github.io/graphics/Background/Ipswich.png')";
    }else{
      bg.style.backgroundImage =
        "url('https://totalmixcreative.github.io/graphics/Background/Bury.png')";
    }

  }catch(e){
    console.log("Sun API failed");
  }

}

setBackgroundBySun();
setInterval(setBackgroundBySun, 300000);

// =========================
// FETCH
// =========================
async function loadTravel(){

  try{
    const res = await fetch(API + "?t=" + Date.now());
    const data = await res.json();

    const slidesData = data.travel || {};

    slides = slidesData.slides || [];
    duration = slidesData.duration || (slides.length * 15);

    localStorage.setItem("travelSlides", JSON.stringify(slidesData));

  }catch(e){
    console.log("Travel fetch failed", e);
  }

}


// =========================
// FORMAT
// =========================
function formatItem(text, type){

  if(type === "rail"){

    if(text.toLowerCase().includes("no reported")){
      return "Greater Anglia – No reported delays";
    }

    return text.replace("🚆 ", "");
  }

  if(type === "road"){
    if(text.toLowerCase().includes("incident")){
      return "Traffic Incident Nearby";
    }
    return text;
  }

  return text;
}

// =========================
// RENDER
// =========================
function render(){

  const box = document.getElementById("box");

  if(!slides.length){
    box.innerHTML = `
      <h1>Travel Update</h1>
      <p>No reported travel disruption</p>
    `;
    return;
  }

  const slide = slides[currentSlide] || [];

  const hasRail = slide.some(item =>
    item.includes("🚆")
  );

  const title = (slides.length > 1)
    ? (hasRail ? "Rail Travel" : "Road Travel")
    : "Travel Update";

  box.innerHTML = `<h1>${title}</h1>`;

  slide.forEach(item => {

    const div = document.createElement("div");
    div.className = "travel-item";

    const type = item.includes("🚆") ? "rail" : "road";

    div.textContent = formatItem(item, type);

    box.appendChild(div);

  });

}

// =========================
// CLOCK LOOP
// =========================
setInterval(() => {

  if(!slides.length){
    render();
    return;
  }

  render();

}, 1000);

// =========================
// INIT
// =========================
loadTravel();
setInterval(loadTravel, 300000);

        
const SLIDE_TIME = 10000; // 10 seconds

setInterval(() => {

  if(slides.length > 1){
    currentSlide = (currentSlide + 1) % slides.length;
  }

}, SLIDE_TIME);

</script>

</body>
</html>
