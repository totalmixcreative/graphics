<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Signage Player</title>

<style>

/* ============================
BASE
============================ */

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
}

/* ===============================
SIDEBAR LOOPING BACKGROUND VIDEO
=============================== */

#SBbgVideo{
position:absolute;
top:0;
left:0px;
width:360px;
height:100%;
object-fit:cover;
z-index:1;
pointer-events:none;
}
	
/* ============================
SIGNAGE CANVAS
============================ */

#canvas{
position:relative;
width:1920px;
height:1080px;
margin:auto;
}

/* ============================
HEADER
============================ */

#header{
position:absolute;
top:18px;
left:30px;
width:100%;
height:100%;
z-index:50;
}

/* ============================
SIDEBAR
============================ */

#sidebar{
position:absolute;
top:190px;
left:61px;
width:359px;
height:900px;
z-index:40;
	transform:scale(0.83);
transform-origin: top left;
}

/* ============================
PROMO AREA
============================ */

#promo{
position:absolute;
width:100%;
top:0px;
left:360px;
right:0px;
bottom:220px;
z-index:10;
}

/* ===============================
   LT LOOPING BACKGROUND VIDEO
=============================== */

#LTbgVideo{
  position:absolute;

  left:0;
  right:60px;     /* match lowerthird */

  bottom:0;
  height:220px;

  width:auto;

  object-fit:cover;

  z-index:99;
  pointer-events:none;
}
	
/* ============================
LOWER THIRD
============================ */

#lowerthird{
position:absolute;
width:100%;
left:0px;
right:60px;
bottom:0px;
height:220px;
z-index:100;
}

/* ============================
IFRAMES
============================ */

iframe{
width:100%;
height:100%;
border:none;
}

/* ============================
CARBON NIGHT MODE
============================ */

#nightMode{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
transform:translateX(100%);
transition:transform 1.2s ease;
z-index:9999;
}

#nightVideo{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:opacity 2s;
}

#nightLogo{
position:absolute;
top:0;
left:0;
pointer-events:none;
opacity:0;
transition:opacity 2s;
}

@keyframes logoGlow{
0%{filter:brightness(1);}
100%{filter:brightness(1.25);}
}

/* ============================
TRANSITION FADE
============================ */

#transitionBlack{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
opacity:0;
transition:opacity 1.2s ease;
z-index:9998;
pointer-events:none;
}

</style>
</head>

<body>

<div id="canvas">

<div id="header">
<iframe id="headerFrame"></iframe>
</div>

<div id="sidebar">
<iframe src="sidebar.html"></iframe>
</div>

<div id="promo">
<iframe src="promoScreen.html"></iframe>
</div>

<div id="lowerthird">
<iframe src="LowerThirds.html"></iframe>
</div>
	
<!-- LT LOOPING BACKGROUND -->
  <video id="LTbgVideo" autoplay muted loop playsinline>
    <source src="https://totalmixcreative.github.io/graphics/carbon%20bottom.mp4" type="video/mp4">
  </video>

<!-- Sidebar background video -->

<video id="SBbgVideo" autoplay muted loop playsinline>
<source src="https://totalmixcreative.github.io/graphics/Side%20Bar%20BG.mp4" type="video/mp4">
</video>

</div>

<!-- Transition layer -->

<div id="transitionBlack"></div>

<!-- Night mode layer -->

<div id="nightMode">

<video id="nightVideo" autoplay muted playsinline></video>
<video id="nightVideoNext" muted playsinline style="display:none;"></video>    

<img src="https://totalmixcreative.github.io/graphics/Carbon/Carbon%20Logo.png" id="nightLogo">

</div>

<script>

let currentLTTheme = "";

function getNthMonday(year, month, n){

  const firstDay = new Date(year, month, 1);
  const firstMondayOffset = (8 - firstDay.getDay()) % 7;
  return new Date(year, month, 1 + firstMondayOffset + (n-1)*7);

}

function getLowerThirdTheme(){

  const nowTime = now();
  const year = nowTime.getFullYear();

  /* ST PATRICKS DAY */
  const stpStart = new Date(year,2,17,10,0,0);
  const stpEnd = new Date(year,2,18,3,0,0);

  if(nowTime >= stpStart && nowTime <= stpEnd){
    return "stpatricks";
  }

  /* HALLOWEEN */
  const halloweenStart = getNthMonday(year,9,2); // Oct
  halloweenStart.setHours(10,0,0);

  const halloweenEnd = new Date(year,10,1,4,0,0);

  if(nowTime >= halloweenStart && nowTime <= halloweenEnd){
    return "halloween";
  }

  /* CHRISTMAS */
  const christmasStart = getNthMonday(year,10,4); // Nov
  christmasStart.setHours(10,0,0);

  const christmasEnd = new Date(year+1,0,1,4,0,0);

  if(nowTime >= christmasStart && nowTime <= christmasEnd){
    return "christmas";
  }

  return "default";
}

function applyLowerThirdTheme(){

  const theme = getLowerThirdTheme();
  if(theme === currentLTTheme) return;

  currentLTTheme = theme;

  const ltVideo = document.getElementById("LTbgVideo");

  const videos = {
    default:
      "https://totalmixcreative.github.io/graphics/carbon%20bottom.mp4",

    stpatricks:
      "https://totalmixcreative.github.io/graphics/LT_green1.mp4",

    halloween:
      "https://totalmixcreative.github.io/graphics/LT_orange.mp4",

    christmas:
      "https://totalmixcreative.github.io/graphics/LT_christmas.mp4"
  };

  ltVideo.querySelector("source").src = videos[theme];
  ltVideo.load();
}
    
const nightVideoNext = document.getElementById("nightVideoNext");
	
/* ============================
SERVER TIME
============================ */

let serverTimeOffset = 0;

async function syncServerTime(){

try{

const res = await fetch("https://worldtimeapi.org/api/timezone/Europe/London");
const data = await res.json();

const serverNow = new Date(data.datetime);
const localNow = new Date();

serverTimeOffset = serverNow - localNow;

}catch(e){

console.log("Server time sync failed, using local clock");

}

}

function now(){

return new Date(Date.now() + serverTimeOffset);

}

syncServerTime();
setInterval(syncServerTime,600000); // resync every 10 minutes

/* ============================
VENUE PARAMETER
============================ */

const params = new URLSearchParams(window.location.search);
const venue = params.get("venue") || "carbon";

document.title = 
venue.charAt(0).toUpperCase() + venue.slice(1) + " Signage Player";

document.getElementById("headerFrame").src =
"logo.html?site=" + venue;

/* ============================
VIDEO LIST
============================ */

const videos = [];

for(let i=1;i<=20;i++){
videos.push(`https://totalmixcreative.github.io/graphics/Carbon/${i}.mp4`);
}
    
/* SATURDAY PLAYLIST */

const saturdayVideos = [
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Abba.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/BuzzBallz.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Cocktails.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Free%20Entry.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Free%20Pool.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/ITFC.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Karaoke.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Shots.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Shots1.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/Sport.mp4",
  "https://totalmixcreative.github.io/graphics/Night%20Shift/wardley.mp4"
];

/* ============================
ELEMENT REFERENCES
============================ */

const transition = document.getElementById("transitionBlack");
const nightVideo = document.getElementById("nightVideo");
const nightLayer = document.getElementById("nightMode");
const nightLogo = document.getElementById("nightLogo");

let nightActive = false;
    
/* MODE DETECTION */

function getNightModeType(){

  let nowTime = now();
  let day = nowTime.getDay();
  let hour = nowTime.getHours();

  if((day === 5 && hour >= 22) || (day === 6 && hour < 4)){
    return "timeline";
  }

  if((day === 6 && hour >= 22) || (day === 0 && hour < 4)){
    return "playlist";
  }

  return "timeline";
}

/* PLAYLIST */

let playlistIndex = 0;

function playPlaylist(){

  const current = nightVideo;
  const next = nightVideoNext;

  // set next video source in advance
  next.src = saturdayVideos[playlistIndex];
  next.load();

  // when current ends, instantly swap
  current.onended = () => {

    current.src = next.src;
    current.play();
    current.style.opacity = 1;

    playlistIndex++;

    if(playlistIndex >= saturdayVideos.length){
      playlistIndex = 0;
    }

    // preload the next-next video
    next.src = saturdayVideos[playlistIndex];
    next.load();

  };

  // start first video if nothing playing
  if(!current.src){
    current.src = saturdayVideos[playlistIndex];
    current.play();

    playlistIndex++;
  }

}

nightVideo.addEventListener("ended", () => {

  if(getNightModeType() === "playlist"){
    playPlaylist();
  }

});

/* ============================
NIGHT MODE SCHEDULE
============================ */

function isNightMode(){

let nowTime = now();

let day = nowTime.getDay();
let hour = nowTime.getHours();
let minute = nowTime.getMinutes();


/* NORMAL SCHEDULE */

return (

  /* FRIDAY NIGHT (ALL VENUES) */
  (day === 5 && hour >= 22) ||
  (day === 6 && hour < 4)  ||

  /* SATURDAY NIGHT (ALL VENUES) */
  (day === 6 && hour >= 22) ||
  (day === 0 && hour < 4) ||

  /* SUNDAY NIGHT (ALL VENUES) */
  (day === 0 && hour >= 22) ||
  (day === 1 && hour < 4) ||

  /* WEEKNIGHTS — CARBON ONLY */
  (
    venue === "carbon" &&
    (
      (day >= 1 && day <= 4 && hour >= 22) ||  // Mon–Thur nights
      (day >= 2 && day <= 5 && hour < 4)       // Tue–Fri early morning
    )
  )

);
}

/* ============================
VIDEO ROTATION
============================ */

let currentIndex = -1;

function loadNightVideo(){

  const mode = getNightModeType();

  /* SATURDAY */
  if(mode === "playlist"){
    nightVideo.loop = false;
    nightLogo.style.opacity = 0;
    playPlaylist();
    return;
  }

  /* FRIDAY */
  nightVideo.loop = true;
  nightLogo.style.opacity = 1;

  let nowTime = now();

  const start = new Date("2026-03-08T22:00:00");

  const diffMinutes =
    Math.floor((nowTime - start) / 60000);

  const slot =
    Math.floor(diffMinutes / 30);

  const index =
    slot % videos.length;

  if(index !== currentIndex){

    currentIndex = index;

    nightVideo.src = videos[index];
    nightVideo.play();

  }

}
/* ============================
MODE CONTROL
============================ */

function isNightStart(){

let nowTime = now();

let hour = nowTime.getHours();
let minute = nowTime.getMinutes();

return hour === 22 && minute === 0;

}
	
function updateMode(){

  if(isNightMode()){

    if(!nightActive){

      nightActive = true;

      transition.style.opacity = 1;

      setTimeout(()=>{

        nightLayer.style.transform = "translateX(0)";
        transition.style.opacity = 0;

        /* if it's exactly 22:00 run full intro */
        if(isNightStart()){

          setTimeout(()=>{

            /* only show logo if NOT Saturday */
            if(getNightModeType() !== "playlist"){
              nightLogo.style.opacity = 1;
            }

            setTimeout(()=>{
              loadNightVideo();
              nightVideo.style.opacity = 1;
            },2000);

          },5000);

        }else{

          loadNightVideo();
          nightVideo.style.opacity = 1;

          if(getNightModeType() !== "playlist"){
            nightLogo.style.opacity = 1;
          }

        }

      },1200);

    }else{

      /* DO NOT interrupt Saturday playlist */
      if(getNightModeType() !== "playlist"){
        loadNightVideo();
      }

    }

  } 
  else if(nightActive){

    nightActive = false;

    transition.style.opacity = 1;

    setTimeout(()=>{
      nightLayer.style.transform = "translateX(100%)";
      nightVideo.pause();
      transition.style.opacity = 0;
    },1200);

  }

}
	
/* ============================
SYNC VIDEO
============================ */
	
const sbVideo = document.getElementById("SBbgVideo");
const ltVideo = document.getElementById("LTbgVideo");

function setVideoPosition(video){

  if(!video.duration) return;

  const serverTime = now().getTime();

  const durationMs = video.duration * 1000;

  const position = (serverTime % durationMs) / 1000;

  video.currentTime = position;

}

function syncVideos(){

  setVideoPosition(sbVideo);
  setVideoPosition(ltVideo);

}

/* sync immediately once metadata loads */
sbVideo.addEventListener("loadedmetadata", syncVideos);
ltVideo.addEventListener("loadedmetadata", syncVideos);

/* small drift correction */
setInterval(()=>{

  const serverTime = now().getTime();

  [sbVideo, ltVideo].forEach(video => {

    if(!video.duration) return;

    const durationMs = video.duration * 1000;

    const expected = (serverTime % durationMs) / 1000;

    if(Math.abs(video.currentTime - expected) > 0.3){
      video.currentTime = expected;
    }

  });

},3000);

/* ============================
CHECK EVERY 30 SECONDS
============================ */

setInterval(updateMode,30000);

updateMode();

/* APPLY LT THEME */
applyLowerThirdTheme();
setInterval(applyLowerThirdTheme,60000);

</script>

</body>
</html>
