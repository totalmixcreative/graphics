<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Signage Player</title>

<style>

/* ============================
BASE
============================ */

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
}

/* ===============================
SIDEBAR LOOPING BACKGROUND VIDEO
=============================== */

#SBbgVideo{
position:absolute;
top:0;
left:0px;
width:360px;
height:100%;
object-fit:cover;
z-index:1;
pointer-events:none;
}
	
/* ============================
SIGNAGE CANVAS
============================ */

#canvas{
position:relative;
width:1920px;
height:1080px;
margin:auto;
}

/* ============================
HEADER
============================ */

#header{
position:absolute;
top:18px;
left:30px;
width:100%;
height:100%;
z-index:50;
}

/* ============================
SIDEBAR
============================ */

#sidebar{
position:absolute;
top:190px;
left:61px;
width:359px;
height:900px;
z-index:40;
	transform:scale(0.83);
transform-origin: top left;
}

/* ============================
PROMO AREA
============================ */

#promo{
position:absolute;
width:100%;
top:0px;
left:360px;
right:0px;
bottom:220px;
z-index:10;
}

/* ===============================
   LT LOOPING BACKGROUND VIDEO
=============================== */

#LTbgVideo{
  position:absolute;

  left:0;
  right:60px;     /* match lowerthird */

  bottom:0;
  height:220px;

  width:auto;

  object-fit:cover;

  z-index:99;
  pointer-events:none;
}
	
/* ============================
LOWER THIRD
============================ */

#lowerthird{
position:absolute;
width:100%;
left:0px;
right:60px;
bottom:0px;
height:220px;
z-index:100;
}

/* ============================
IFRAMES
============================ */

iframe{
width:100%;
height:100%;
border:none;
}

/* ============================
CARBON NIGHT MODE
============================ */

#nightMode{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
transform:translateX(100%);
transition:transform 1.2s ease;
z-index:9999;
}

#nightVideo{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}
	
#nightBumper{

  position:absolute;
  inset:0;

  z-index:20;

  pointer-events:none;

  opacity:0;

}

#nightBumper.show{

  animation:
    nightBumperIn 0.7s
    cubic-bezier(0.2,0.8,0.2,1)
    forwards;

}

#nightBumper.hide{

  animation:
    nightBumperOut 0.6s
    ease forwards;

}

@keyframes nightBumperIn{

  0%{
    opacity:0;
    transform:scale(0.8)
      translateY(60px);
  }

  60%{
    opacity:1;
    transform:scale(1.05)
      translateY(-10px);
  }

  100%{
    opacity:1;
    transform:scale(1)
      translateY(0);
  }

}

@keyframes nightBumperOut{

  0%{
    opacity:1;
    transform:scale(1)
      translateY(0);
  }

  100%{
    opacity:0;
    transform:scale(1.03)
      translateY(-20px);
  }

}
	
/* ===============================
SIDEBAR GRADIENT BACKGROUND
=============================== */

#SBbg{

  position:absolute;

  top:0;
  left:0;

  width:360px;
  height:100%;

  z-index:1;

  background:
    linear-gradient(
      180deg,
      #ffffff,
      #efefef,
      #dcdcdc,
      #ffffff
    );

  background-size:100% 400%;

  animation:
    sidebarGradient 25s ease infinite;

}

/* ===============================
LOWER THIRD GRADIENT
=============================== */

#LTbg{

  position:absolute;

  bottom:0;
  left:0;

  width:100%;
  height:220px;

  z-index:99;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #ff0040,
      #ff7b00,
      #ff0040,
      #ff00b3
    );

  background-size:400% 400%;

  animation:
    lowerThirdGradient 20s ease infinite;

}

/* ===============================
ANIMATIONS
=============================== */

@keyframes sidebarGradient{

  0%{
    background-position:50% 0%;
  }

  50%{
    background-position:50% 100%;
  }

  100%{
    background-position:50% 0%;
  }

}

@keyframes lowerThirdGradient{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}

</style>
</head>

<body>

<div id="canvas">

<div id="header">
<iframe id="headerFrame"></iframe>
</div>

<div id="sidebar">
<iframe src="sidebar.html"></iframe>
</div>

<div id="promo">
<iframe src="promoScreen.html"></iframe>
</div>

<div id="lowerthird">
<iframe src="LowerThirds.html"></iframe>
</div>
	
<!-- LT LOOPING BACKGROUND -->
<div id="LTbg"></div>

<!-- Sidebar background -->

<div id="SBbg"></div>

</div>

<!-- Night mode layer -->

<div id="nightMode">

  <video
    id="nightVideo"
    autoplay
    muted
    playsinline>
  </video>

<div id="nightBumper">

<svg
  id="nightBumperSVG"
  width="100%"
  height="100%"
  viewBox="0 0 1920 1080">

<defs>

<linearGradient id="nightGrad">

  <animate
    attributeName="x1"
    values="0%;100%;0%"
    dur="20s"
    repeatCount="indefinite"/>

  <animate
    attributeName="x2"
    values="100%;0%;100%"
    dur="20s"
    repeatCount="indefinite"/>

  <stop
    id="nightGradStart"
    offset="0%"
    stop-color="#ff2a8a"/>

  <stop
    id="nightGradEnd"
    offset="100%"
    stop-color="#ff7a18"/>

</linearGradient>

</defs>

<rect
  width="100%"
  height="100%"
  fill="url(#nightGrad)"/>

<text
  id="nightBumperText"
  x="50%"
  y="50%"
  text-anchor="middle"
  dominant-baseline="middle"
  font-size="170"
  font-family="Robuck"
  fill="white"
  letter-spacing="4">

  CARBON NIGHTS

</text>

</svg>

</div>

</div>
	
<script>

let currentLTTheme = "";

function getNthMonday(year, month, n){

  const firstDay = new Date(year, month, 1);
  const firstMondayOffset = (8 - firstDay.getDay()) % 7;
  return new Date(year, month, 1 + firstMondayOffset + (n-1)*7);

}

	
/* ============================
SERVER TIME
============================ */

const MASTER_EPOCH =
new Date("2026-01-01T00:00:00Z").getTime();

function getElapsedTime(){
  return now().getTime() - MASTER_EPOCH;
}    
	
function syncGradient(element,duration){

  const elapsed =
    getElapsedTime() / 1000;

  const offset =
    -(elapsed % duration);

  element.style.animationDelay =
    `${offset}s`;

}
    
let serverTimeOffset = 0;

async function syncServerTime(){

  try{

    const res = await fetch(
      "https://timeapi.world/timezone/Europe/London"
    );

    const data = await res.json();

    const serverNow = new Date(data.datetime);
    const localNow = new Date();

    serverTimeOffset = serverNow - localNow;

  }catch(e){

    console.log("Server time sync failed");

  }

}

function now(){
  return new Date(Date.now() + serverTimeOffset);
}

/* ============================
VENUE PARAMETER
============================ */

const params = new URLSearchParams(window.location.search);
const venue = params.get("venue") || "carbon";

document.title = 
venue.charAt(0).toUpperCase() + venue.slice(1) + " Signage Player";

document.getElementById("headerFrame").src =
"logo.html?site=" + venue;
    
let playlistManifest = [];

let playlistTimeline = [];
let totalPlaylistDuration = 0;

async function loadPlaylistManifest(){

  try{

    const res = await fetch(
      "night-playlist.json?t=" + Date.now()
    );

    const data = await res.json();

    playlistManifest = data.videos || [];

    buildPlaylistTimeline();

  }catch(e){

    console.log("Playlist manifest failed");

  }

}

function buildPlaylistTimeline(){

  playlistTimeline = [];
  totalPlaylistDuration = 0;

  playlistManifest.forEach((video, i)=>{

    playlistTimeline.push({
      index: i,
      start: totalPlaylistDuration,
      end: totalPlaylistDuration + video.duration
    });

    totalPlaylistDuration += video.duration;

  });

}
    
    function syncPlaylistVideo(){

  if(!playlistTimeline.length) return;

  const elapsed =
    Math.floor(getElapsedTime() / 1000);

  const playlistTime =
    elapsed % totalPlaylistDuration;

  let activeVideo = null;

  for(const video of playlistTimeline){

    if(
      playlistTime >= video.start &&
      playlistTime < video.end
    ){
      activeVideo = video;
      break;
    }

  }

  if(!activeVideo) return;

  const expectedSrc =
    playlistManifest[activeVideo.index].src;

  const localTime =
    playlistTime - activeVideo.start;

  if(currentNightVideo !== expectedSrc){

  currentNightVideo = expectedSrc;

  /* TRIGGER BUMPER */

  showNightBumper();

  /* SWAP VIDEO UNDER BUMPER */

  setTimeout(()=>{

    nightVideo.src = expectedSrc;

    nightVideo.addEventListener(
      "loadedmetadata",
      ()=>{

        nightVideo.currentTime = localTime;
        nightVideo.play();

      },
      { once:true }
    );

  },250);

}

	}

/* ============================
ELEMENT REFERENCES
============================ */

const nightVideo = document.getElementById("nightVideo");
const nightBumper =
document.getElementById("nightBumper");

const nightLayer = document.getElementById("nightMode");
let currentNightVideo = "";
let nightActive = false;
let playlistSyncInterval = null;
	

function showNightBumper(){

  const bumper =
    document.getElementById("nightBumper");

  bumper.classList.remove("show");
  bumper.classList.remove("hide");

  void bumper.offsetWidth;

  bumper.classList.add("show");

  setTimeout(()=>{

    bumper.classList.remove("show");
    bumper.classList.add("hide");

  },1400);

}

/* ============================
NIGHT MODE SCHEDULE
============================ */

function isNightMode(){

  const nowTime = now();

  const day = nowTime.getDay();
  const hour = nowTime.getHours();

  /* CARBON = EVERY NIGHT */
  if(venue === "carbon"){

    return (
      (hour >= 22) ||
      (hour < 4)
    );

  }

  /* MILL = FRI/SAT ONLY */
  if(venue === "mill"){

    return (

      (day === 5 && hour >= 22) ||
      (day === 6 && hour < 4) ||

      (day === 6 && hour >= 22) ||
      (day === 0 && hour < 4)

    );

  }

  return false;

}

/* ============================
MODE CONTROL
============================ */

function isNightStart(){

let nowTime = now();

let hour = nowTime.getHours();
let minute = nowTime.getMinutes();

return hour === 22 && minute === 0;

}
	
function updateMode(){

  if(isNightMode()){

    if(!nightActive){

      nightActive = true;
      
	 playlistSyncInterval =
  setInterval(syncPlaylistVideo,1000);

      nightLayer.style.transform = "translateX(0)";

      /* full intro exactly at 22:00 */
      if(isNightStart()){

        setTimeout(()=>{

          syncPlaylistVideo();

        },5000);

      }else{

        syncPlaylistVideo();

      }

    }

  }else if(nightActive){

    nightActive = false;
	  
	  clearInterval(playlistSyncInterval);

    nightLayer.style.transform = "translateX(100%)";

    nightVideo.pause();

  }

}
	
let nightHue = 0;

setInterval(()=>{

  nightHue =
    (nightHue + 1) % 360;

  const color1 =
    `hsl(${nightHue},90%,55%)`;

  const color2 =
    `hsl(${(nightHue+40)%360},90%,55%)`;

  document
    .getElementById("nightGradStart")
    .setAttribute("stop-color",color1);

  document
    .getElementById("nightGradEnd")
    .setAttribute("stop-color",color2);

},100);

/* ============================
CHECK EVERY 30 SECONDS
============================ */

async function init(){
	
document.getElementById(
  "nightBumperText"
).textContent =

  venue === "mill"
    ? "THE MILL NIGHTS"
    : "CARBON NIGHTS";

  await syncServerTime();

  /* resync every 5 mins */
  setInterval(syncServerTime,300000);

  await loadPlaylistManifest();

  /* refresh manifest every 10 mins */
  setInterval(loadPlaylistManifest,600000);

  syncGradient(
  document.getElementById("SBbg"),
  25
);

syncGradient(
  document.getElementById("LTbg"),
  20
);

    /* NIGHT PLAYLIST SYNC */
    if(isNightMode()){
      syncPlaylistVideo();
    }

  setInterval(updateMode,30000);

  updateMode();

}

init();

</script>

</body>
</html>
