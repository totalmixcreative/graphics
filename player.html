<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
    <title>Signage Player</title>

<style>

/* ============================
BASE
============================ */

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:black;
}

/* ===============================
SIDEBAR LOOPING BACKGROUND VIDEO
=============================== */

#SBbgVideo{
position:absolute;
top:0;
left:0px;
width:360px;
height:100%;
object-fit:cover;
z-index:1;
pointer-events:none;
}
	
/* ============================
SIGNAGE CANVAS
============================ */

#canvas{
position:relative;
width:1920px;
height:1080px;
margin:auto;
}

/* ============================
HEADER
============================ */

#header{
position:absolute;
top:18px;
left:30px;
width:100%;
height:100%;
z-index:50;
}

/* ============================
SIDEBAR
============================ */

#sidebar{
position:absolute;
top:190px;
left:61px;
width:359px;
height:900px;
z-index:40;
	transform:scale(0.83);
transform-origin: top left;
}

/* ============================
PROMO AREA
============================ */

#promo{
position:absolute;
width:100%;
top:0px;
left:360px;
right:0px;
bottom:220px;
z-index:10;
}

/* ===============================
   LT LOOPING BACKGROUND VIDEO
=============================== */

#LTbgVideo{
  position:absolute;

  left:0;
  right:60px;     /* match lowerthird */

  bottom:0;
  height:220px;

  width:auto;

  object-fit:cover;

  z-index:99;
  pointer-events:none;
}
	
/* ============================
LOWER THIRD
============================ */

#lowerthird{
position:absolute;
width:100%;
left:0px;
right:60px;
bottom:0px;
height:220px;
z-index:100;
}

/* ============================
IFRAMES
============================ */

iframe{
width:100%;
height:100%;
border:none;
}

/* ============================
CARBON NIGHT MODE
============================ */

#nightMode{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
transform:translateX(100%);
transition:transform 1.2s ease;
z-index:9999;
}

#nightVideo{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

</style>
</head>

<body>

<div id="canvas">

<div id="header">
<iframe id="headerFrame"></iframe>
</div>

<div id="sidebar">
<iframe src="sidebar.html"></iframe>
</div>

<div id="promo">
<iframe src="promoScreen.html"></iframe>
</div>

<div id="lowerthird">
<iframe src="LowerThirds.html"></iframe>
</div>
	
<!-- LT LOOPING BACKGROUND -->
  <video id="LTbgVideo" autoplay muted loop playsinline>
    <source src="https://totalmixcreative.github.io/graphics/carbon%20bottom.mp4" type="video/mp4">
  </video>

<!-- Sidebar background video -->

<video id="SBbgVideo" autoplay muted loop playsinline>
<source src="https://totalmixcreative.github.io/graphics/Side%20Bar%20BG.mp4" type="video/mp4">
</video>

</div>

<!-- Night mode layer -->

<div id="nightMode">

<video id="nightVideo" autoplay muted playsinline></video>

</div>

<script>

let currentLTTheme = "";

function getNthMonday(year, month, n){

  const firstDay = new Date(year, month, 1);
  const firstMondayOffset = (8 - firstDay.getDay()) % 7;
  return new Date(year, month, 1 + firstMondayOffset + (n-1)*7);

}

function getLowerThirdTheme(){

  const nowTime = now();
  const year = nowTime.getFullYear();

  /* ST PATRICKS DAY */
  const stpStart = new Date(year,2,17,10,0,0);
  const stpEnd = new Date(year,2,18,3,0,0);

  if(nowTime >= stpStart && nowTime <= stpEnd){
    return "stpatricks";
  }

  /* HALLOWEEN */
  const halloweenStart = getNthMonday(year,9,2); // Oct
  halloweenStart.setHours(10,0,0);

  const halloweenEnd = new Date(year,10,1,4,0,0);

  if(nowTime >= halloweenStart && nowTime <= halloweenEnd){
    return "halloween";
  }

  /* CHRISTMAS */
  const christmasStart = getNthMonday(year,10,4); // Nov
  christmasStart.setHours(10,0,0);

  const christmasEnd = new Date(year+1,0,1,4,0,0);

  if(nowTime >= christmasStart && nowTime <= christmasEnd){
    return "christmas";
  }

  return "default";
}

function applyLowerThirdTheme(){

  const theme = getLowerThirdTheme();
  if(theme === currentLTTheme) return;

  currentLTTheme = theme;

  const ltVideo = document.getElementById("LTbgVideo");

  const videos = {
    default:
      "https://totalmixcreative.github.io/graphics/carbon%20bottom.mp4",

    stpatricks:
      "https://totalmixcreative.github.io/graphics/LT_green1.mp4",

    halloween:
      "https://totalmixcreative.github.io/graphics/LT_orange.mp4",

    christmas:
      "https://totalmixcreative.github.io/graphics/LT_christmas.mp4"
  };

  ltVideo.querySelector("source").src = videos[theme];
  ltVideo.load();
}
    

	
/* ============================
SERVER TIME
============================ */

const MASTER_EPOCH =
new Date("2026-01-01T00:00:00Z").getTime();

function getElapsedTime(){
  return now().getTime() - MASTER_EPOCH;
}    
    
let serverTimeOffset = 0;

async function syncServerTime(){

  try{

    const res = await fetch(
      "https://timeapi.world/timezone/Europe/London"
    );

    const data = await res.json();

    const serverNow = new Date(data.datetime);
    const localNow = new Date();

    serverTimeOffset = serverNow - localNow;

  }catch(e){

    console.log("Server time sync failed");

  }

}

function now(){
  return new Date(Date.now() + serverTimeOffset);
}

syncServerTime();

/* resync every 5 mins */
setInterval(syncServerTime,300000);

/* ============================
VENUE PARAMETER
============================ */

const params = new URLSearchParams(window.location.search);
const venue = params.get("venue") || "carbon";

document.title = 
venue.charAt(0).toUpperCase() + venue.slice(1) + " Signage Player";

document.getElementById("headerFrame").src =
"logo.html?site=" + venue;
    
let playlistManifest = [];

let playlistTimeline = [];
let totalPlaylistDuration = 0;

async function loadPlaylistManifest(){

  try{

    const res = await fetch(
      "night-playlist.json?t=" + Date.now()
    );

    const data = await res.json();

    playlistManifest = data.videos || [];

    buildPlaylistTimeline();

  }catch(e){

    console.log("Playlist manifest failed");

  }

}

function buildPlaylistTimeline(){

  playlistTimeline = [];
  totalPlaylistDuration = 0;

  playlistManifest.forEach((video, i)=>{

    playlistTimeline.push({
      index: i,
      start: totalPlaylistDuration,
      end: totalPlaylistDuration + video.duration
    });

    totalPlaylistDuration += video.duration;

  });

}
    
    function syncPlaylistVideo(){

  if(!playlistTimeline.length) return;

  const elapsed =
    Math.floor(getElapsedTime() / 1000);

  const playlistTime =
    elapsed % totalPlaylistDuration;

  let activeVideo = null;

  for(const video of playlistTimeline){

    if(
      playlistTime >= video.start &&
      playlistTime < video.end
    ){
      activeVideo = video;
      break;
    }

  }

  if(!activeVideo) return;

  const expectedSrc =
    playlistManifest[activeVideo.index].src;

  const localTime =
    playlistTime - activeVideo.start;

  if(!nightVideo.src.endsWith(expectedSrc)){

    nightVideo.src = expectedSrc;

    nightVideo.addEventListener(
      "loadedmetadata",
      ()=>{

        nightVideo.currentTime = localTime;
        nightVideo.play();

      },
      { once:true }
    );

  }else{

    if(
      Math.abs(
        nightVideo.currentTime - localTime
      ) > 0.3
    ){
      nightVideo.currentTime = localTime;
    }

  }

}

/* ============================
ELEMENT REFERENCES
============================ */

const nightVideo = document.getElementById("nightVideo");
const nightLayer = document.getElementById("nightMode");

let nightActive = false;

/* ============================
NIGHT MODE SCHEDULE
============================ */

function isNightMode(){

  const nowTime = now();

  const day = nowTime.getDay();
  const hour = nowTime.getHours();

  /* CARBON = EVERY NIGHT */
  if(venue === "carbon"){

    return (
      (hour >= 22) ||
      (hour < 4)
    );

  }

  /* MILL = FRI/SAT ONLY */
  if(venue === "mill"){

    return (

      (day === 5 && hour >= 22) ||
      (day === 6 && hour < 4) ||

      (day === 6 && hour >= 22) ||
      (day === 0 && hour < 4)

    );

  }

  return false;

}

/* ============================
MODE CONTROL
============================ */

function isNightStart(){

let nowTime = now();

let hour = nowTime.getHours();
let minute = nowTime.getMinutes();

return hour === 22 && minute === 0;

}
	
function updateMode(){

  if(isNightMode()){

    if(!nightActive){

      nightActive = true;

      nightLayer.style.transform = "translateX(0)";

      /* full intro exactly at 22:00 */
      if(isNightStart()){

        setTimeout(()=>{

          syncPlaylistVideo();

        },5000);

      }else{

        syncPlaylistVideo();

      }

    }

  }else if(nightActive){

    nightActive = false;

    nightLayer.style.transform = "translateX(100%)";

    nightVideo.pause();

  }

}
    
/* ============================
SYNC VIDEO
============================ */
	
const sbVideo = document.getElementById("SBbgVideo");
const ltVideo = document.getElementById("LTbgVideo");

function setVideoPosition(video){

  if(!video.duration) return;

  const elapsed = getElapsedTime();

  const durationMs = video.duration * 1000;

  const position = (elapsed % durationMs) / 1000;

  video.currentTime = position;

}

function syncVideos(){

  setVideoPosition(sbVideo);
  setVideoPosition(ltVideo);

}

/* sync immediately once metadata loads */
sbVideo.addEventListener("loadedmetadata", syncVideos);
ltVideo.addEventListener("loadedmetadata", syncVideos);

/* small drift correction */
setInterval(()=>{

  const elapsed = getElapsedTime();

  [sbVideo, ltVideo].forEach(video => {

    if(!video.duration) return;

    const durationMs = video.duration * 1000;

    const expected = (elapsed % durationMs) / 1000;

    if(Math.abs(video.currentTime - expected) > 0.1){
      video.currentTime = expected;
    }

  });

  /* NIGHT PLAYLIST SYNC */
  if(isNightMode()){
    syncPlaylistVideo();
  }

},1000);

/* ============================
CHECK EVERY 30 SECONDS
============================ */

loadPlaylistManifest();

/* refresh manifest every 10 mins */
setInterval(loadPlaylistManifest,600000);

setInterval(updateMode,30000);

updateMode();

/* APPLY LT THEME */
applyLowerThirdTheme();
setInterval(applyLowerThirdTheme,60000);

</script>

</body>
</html>
