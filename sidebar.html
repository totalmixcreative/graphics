/**************** WC ANIMATIONS ****************/
.wc-fixture-animate{
  animation:
    wcFixtureIn .7s cubic-bezier(.22,1,.36,1);

  animation-delay:.55s;
  animation-fill-mode:both;
}

@keyframes wcFixtureIn{

  0%{
    opacity:0;
    transform:translateY(35px);
  }

  100%{
    opacity:1;
    transform:translateY(0);
  }

}

/* COUNTDOWN */

.wc-countdown-animate{
  animation:
    wcCountdownIn .9s cubic-bezier(.22,1,.36,1);

  animation-delay:.9s;
  animation-fill-mode:both;
}

@keyframes wcCountdownIn{

  0%{
    opacity:0;
    transform:scale(.6);
  }

  70%{
    transform:scale(1.06);
  }

  100%{
    opacity:1;
    transform:scale(1);

<body>

<script>
const API = "https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";   // ← PUT YOUR /exec URL HERE
const SLIDE_WIDTH = 359;

let serverOffset = 0;
let sliderInterval = null;
let lastUpdated = null;
let currentMatches = [];
let imageVersion = Date.now();
	
let latestEnglandWorldCup = null;
let worldCupTakeover = false;
	
const MASTER_EPOCH =
  new Date("2026-01-01T00:00:00Z").getTime();

function now(){
  return Date.now() + serverOffset;
}

function getElapsedTime(){
  return now() - MASTER_EPOCH;
}
	
const FLAG_BASE =

/**************** FETCH DATA ****************/
async function fetchData() {

  try {

    const res =
      await fetch(API + "?_=" + Date.now());

    const data =
      await res.json();

    const newMatches =
      JSON.stringify(data.matches || []);

    const oldMatches =
      JSON.stringify(currentMatches || []);

    if (newMatches !== oldMatches) {

      lastUpdated = data.updated;

      imageVersion = data.updated;

      currentMatches =
  (data.matches || []).filter(m => {

    const isWorldCup =
      /world cup/i.test(
        m.competition || ""
      );

    return !isWorldCup;

  });

      latestEnglandWorldCup =
        data.englandWorldCup || null;

      // Only render normal sidebar
      // if takeover isn't active
      if(!worldCupTakeover){

        render(currentMatches);

lastSidebarIndex = -1;

      }

    }

  } catch (err) {

    console.error(
      "Fetch error:",
      err
    );

  }

}
/**************** TIME LOGIC ****************/
function calculateLabel(m){

  const now = Date.now() + serverOffset;

  if(now >= m.startTime && now <= m.endTime){
    return "LIVE NOW";
  }

  if(now < m.startTime && (m.startTime - now) <= 60*60*1000){

    const start = new Date(m.startTime);

    let hours = start.getHours();
    const minutes = start.getMinutes();

    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours ? hours : 12;

    if(minutes === 0){
      return `UP NEXT • ${hours}${ampm}`;
    }

    const padded =
      minutes.toString().padStart(2,"0");

    return `UP NEXT • ${hours}:${padded}${ampm}`;
  }

  return m.label;

}

/**************** RENDER ****************/
function render(matches) {
  const slider = document.getElementById("slider");
  slider.innerHTML = "";
	lastSidebarIndex = -1;

  matches.forEach((m, i) => {
    const displayLabel = calculateLabel(m);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
  <div class="team-img"
       style="background-image:url('https://drive.google.com/thumbnail?id=${m.homeImg}&sz=w1000&v=${imageVersion}')"></div>

  <div class="info">

    ${m.competitionImg ? `
      <div class="competition" data-competition="${m.competition}">
        <img src="https://drive.google.com/thumbnail?id=${m.competitionImg}&sz=w1000&v=${imageVersion}">
      </div>` : `
      <div class="competition fallback-text">
        ${m.competition}
      </div>
    `}

    <div class="fixture">
      <div class="team home">${m.home}</div>
      ${m.away ? `<div class="versus">v</div>` : ""}
      ${m.away ? `<div class="team away">${m.away}</div>` : ""}
    </div>

    <div class="time ${displayLabel === 'LIVE NOW' ? 'live' : ''}">
      ${displayLabel === 'LIVE NOW' ? '<span class="live-dot"></span>' : ''}
      ${displayLabel}
    </div>

  </div>
`;

    // Make first card visible immediately
    if (i === 0) {
      card.style.transform = "translateX(0)";
      card.style.opacity = "1";
    }

    slider.appendChild(card);
  });


}

const homeFlag =

const awayFlag =

const countdownParts =

const countdownNumber =

const countdownLabel =

<!-- SLIDE 2 -->
<div class="wc-slide wc-slide-2"

      background-image:url(
        'https://totalmixcreative.github.io/graphics/wchero.png'

<div class="wc-confetti">

</div>

  <div class="infowc">

</div>

<!-- SLIDE 3 -->
<div class="wc-slide wc-slide-3"

  <div class="wc-img"
    style="
      background-image:url(
        'https://totalmixcreative.github.io/graphics/wchero.png'
      )">
  </div>

<div class="wc-confetti">

  <div class="confetti"></div>
  <div class="confetti"></div>
  <div class="confetti"></div>
  <div class="confetti"></div>
  <div class="confetti"></div>

</div>

  <div class="infowc">

  card.style.transform = "translateX(0)";

/**************** WC TIMER ****************/

const WC_INTERVAL = 240000;
const WC_DURATION = 30000;

setInterval(() => {

  if(!latestEnglandWorldCup) return;

  const cyclePosition =
    getElapsedTime() % WC_INTERVAL;

  const shouldBeActive =
    cyclePosition < WC_DURATION;

  /* START TAKEOVER */

  if(shouldBeActive && !worldCupTakeover){

    worldCupTakeover = true;

    renderWorldCupTakeover(
      latestEnglandWorldCup
    );

  }

  /* END TAKEOVER */

  if(!shouldBeActive && worldCupTakeover){

    worldCupTakeover = false;

    render(currentMatches);

  }

}, 1000);


	
/**************** SLIDER ****************/
let lastSidebarIndex = -1;

const SIDEBAR_DURATION = 9000; // same timing you used

setInterval(()=>{

  const slider =
    document.getElementById("slider");

  const cards = slider.children;

  if(!cards.length) return;

  const globalIndex =
  Math.floor(getElapsedTime()/SIDEBAR_DURATION)
  % cards.length;

  if(globalIndex === lastSidebarIndex)
    return;

  lastSidebarIndex = globalIndex;

  /* reset all cards */
  Array.from(cards).forEach(card=>{
    card.style.transform="translateX(100%)";
    card.style.opacity="0";
  });

  const nextCard = cards[globalIndex];

  nextCard.style.transition =
    "transform 0.6s cubic-bezier(.22,1,.36,1), opacity 0.6s ease";

  nextCard.style.transform="translateX(0)";
  nextCard.style.opacity="1";

},250);
/**************** LIVE LABEL UPDATER ****************/
setInterval(() => {
  const cards = document.querySelectorAll(".card");

  cards.forEach((card, index) => {
    if(worldCupTakeover) return;

const m = currentMatches[index];
if (!m) return;

    const displayLabel = calculateLabel(m);
    const timeDiv = card.querySelector(".time");
    if (!timeDiv) return;

    timeDiv.className = "time " + (displayLabel === "LIVE NOW" ? "live" : "");
    timeDiv.innerHTML =
      (displayLabel === "LIVE NOW" ? '<span class="live-dot"></span>' : '') +
      displayLabel;
  });

}, 1000);

/**************** INITIAL LOAD ****************/

async function syncServerTime(){

  try{

    const res = await fetch(
      "https://timeapi.world/timezone/Europe/London"
    );

    const data = await res.json();

    const serverNow = new Date(data.datetime);
    const localNow = new Date();

    serverOffset = serverNow - localNow;

  }catch(e){

    console.log("Server time sync failed");

  }

}
    
async function init(){

  await syncServerTime();

  /* resync every 5 mins */
  setInterval(syncServerTime,300000);

  await fetchData();

  setInterval(fetchData,30000);

}

init();

/**************** OBS KEEP ALIVE ****************/
setInterval(() => {
  document.body.dataset.keepalive = Date.now();
}, 30000);

</script>
