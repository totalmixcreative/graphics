/**************** WC ANIMATIONS ****************/
.wc-fixture-animate{
  animation:
    wcFixtureIn .7s cubic-bezier(.22,1,.36,1);

  animation-delay:.55s;
  animation-fill-mode:both;
}

@keyframes wcFixtureIn{

  0%{
    opacity:0;
    transform:translateY(35px);
  }

  100%{
    opacity:1;
    transform:translateY(0);
  }

}

/* COUNTDOWN */

.wc-countdown-animate{
  animation:
    wcCountdownIn .9s cubic-bezier(.22,1,.36,1);

  animation-delay:.9s;
  animation-fill-mode:both;
}

@keyframes wcCountdownIn{

  0%{
    opacity:0;
    transform:scale(.6);
  }

  70%{
    transform:scale(1.06);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }

}

/* CTA */

.wc-cta-animate{
  animation:
    wcCTAIn .7s ease-out;

  animation-delay:1.25s;
  animation-fill-mode:both;
}

@keyframes wcCTAIn{

  0%{
    opacity:0;
    transform:translateY(30px);
  }

  100%{
    opacity:1;
    transform:translateY(0);
  }

}

/* Competition logos now share one consistent size; no per-sport height overrides. */

/* Interpolate palette colours directly; the lava and ring animations remain running. */
@property --lava-a { syntax: "<color>"; inherits: true; initial-value: #370343; }
@property --lava-b { syntax: "<color>"; inherits: true; initial-value: #fd0166; }
@property --ring-a { syntax: "<color>"; inherits: true; initial-value: #180b65; }
@property --ring-b { syntax: "<color>"; inherits: true; initial-value: #a000c7; }

/* Persistent lava lamp: a single background surface that survives fixture changes. */
#ffLavaLampCanvas{
  position:fixed;left:0;top:0;width:359px;height:324px;overflow:hidden;
  pointer-events:none;z-index:0;display:none;isolation:isolate;
  background:linear-gradient(135deg,color-mix(in srgb,var(--lava-a,#370343) 48%,#080711) 0%,#100d20 55%,color-mix(in srgb,var(--lava-b,#fd0166) 36%,#070611) 100%);
  --lava-a:#370343;--lava-b:#fd0166;
}
#ffLavaLampCanvas.is-visible{display:block;}
#ffLavaLampCanvas .lava-blob{position:absolute;inset:-28%;border-radius:48%;filter:blur(30px);will-change:transform;}
#ffLavaLampCanvas .lava-blob:nth-child(1){
 background:radial-gradient(ellipse at 38% 42%,color-mix(in srgb,var(--lava-b) 92%,transparent) 0%,color-mix(in srgb,var(--lava-b) 52%,transparent) 30%,transparent 66%);
 animation:lavaFlowOne 29s ease-in-out infinite alternate;
}
#ffLavaLampCanvas .lava-blob:nth-child(2){
 background:radial-gradient(ellipse at 62% 52%,color-mix(in srgb,var(--lava-a) 96%,transparent) 0%,color-mix(in srgb,var(--lava-a) 64%,transparent) 34%,transparent 68%);
 animation:lavaFlowTwo 37s ease-in-out infinite alternate;
}
#ffLavaLampCanvas .lava-blob:nth-child(3){
 background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--lava-b) 44%,transparent) 0%,transparent 62%);
 animation:lavaFlowThree 43s ease-in-out infinite alternate;
}
@keyframes lavaFlowOne{0%{transform:translate(-13%,-9%) rotate(-8deg) scale(.94)}33%{transform:translate(10%,7%) rotate(9deg) scale(1.12)}68%{transform:translate(4%,-12%) rotate(18deg) scale(1.04)}100%{transform:translate(-9%,12%) rotate(4deg) scale(1.16)}}
@keyframes lavaFlowTwo{0%{transform:translate(11%,10%) rotate(12deg) scale(1.08)}36%{transform:translate(-10%,-5%) rotate(-10deg) scale(.96)}72%{transform:translate(-3%,12%) rotate(-18deg) scale(1.14)}100%{transform:translate(12%,-9%) rotate(7deg) scale(1.02)}}
@keyframes lavaFlowThree{0%{transform:translate(-7%,11%) rotate(0deg) scale(1.02)}40%{transform:translate(12%,-10%) rotate(16deg) scale(1.15)}75%{transform:translate(-12%,-2%) rotate(-12deg) scale(.95)}100%{transform:translate(6%,9%) rotate(8deg) scale(1.1)}}
#ffLavaLampCanvas{--ring-a:#180b65;--ring-b:#a000c7;transition:--lava-a 1.8s ease, --lava-b 1.8s ease, --ring-a 1.8s ease, --ring-b 1.8s ease;}

/* FOOTBALL FF — isolated portrait header; non-football cards remain unchanged */
/* F1 uses the shared fixture header with its own blue background and red rings. */
.ff-header.ff-f1-header{ background:transparent !important; }
.ff-f1-logo{
  display:block;
  width:220px;
  height:auto;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  position:relative;
  z-index:2;
}

/* Boxing uses a yellow-and-black header, with its event artwork centred over the rings. */
.ff-header.ff-boxing-header{ background:transparent !important; }
.ff-boxing-logo{
  display:block;
  width:359px;
  height:324px;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  position:relative;
  z-index:10;
}

.ff-header{
  position:relative;width:359px;height:324px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 52%,var(--ff-glow,rgba(65,0,100,.35)) 0%,transparent 55%),
    linear-gradient(135deg,#281033 0%,#382044 55%,#21102c 100%);
}

/* The lava-lamp animation lives on one persistent viewport layer, not on each card. */
.ff-header{
  background:transparent !important;
  position:relative;
  z-index:1;
}
@keyframes ffCircularHue{
  0%{background-size:82% 82%,94% 94%,100% 100%;}
  50%{background-size:118% 118%,110% 110%,100% 100%;}
  100%{background-size:88% 88%,102% 102%,100% 100%;}
}
#ffLavaLampCanvas .ff-rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
#ffLavaLampCanvas .ff-ring{position:absolute;width:var(--ring-size);height:var(--ring-size);box-sizing:border-box;border:5px solid transparent;border-radius:50%;
  background:linear-gradient(90deg,var(--ring-a,#180b65),var(--ring-b,#a000c7)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:.72;}
#ffLavaLampCanvas .ff-ring{width:320px;height:320px;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.42;}
/* STEP 28 — layer Step 22's original travelling sweep over Step 25's sequential ring illumination.
   Keep the sweep gradient and timing from Step 22; extend it to football, F1 and Boxing.
   The base rings brighten sequentially while the narrow highlight continues travelling around them. */
#ffLavaLampCanvas .ff-ring:nth-child(1){width:132px;height:132px;}
#ffLavaLampCanvas .ff-ring:nth-child(2){width:176px;height:176px;}
#ffLavaLampCanvas .ff-ring:nth-child(3){width:220px;height:220px;}
#ffLavaLampCanvas .ff-ring:nth-child(4){width:264px;height:264px;}
#ffLavaLampCanvas .ff-ring:nth-child(5){width:308px;height:308px;}
#ffLavaLampCanvas .ff-ring{opacity:.2;animation:ffRingIlluminate 5s ease-in-out infinite;}
#ffLavaLampCanvas .ff-ring:nth-child(2){animation-delay:.8s;}
#ffLavaLampCanvas .ff-ring:nth-child(3){animation-delay:1.6s;}
#ffLavaLampCanvas .ff-ring:nth-child(4){animation-delay:2.4s;}
#ffLavaLampCanvas .ff-ring:nth-child(5){animation-delay:3.2s;}
#ffLavaLampCanvas .ff-ring::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;padding:5px;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0deg 270deg,rgba(255,255,255,.05) 300deg,var(--ring-b,#a000c7) 326deg,rgba(255,255,255,.9) 342deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  animation:ffSweepLight 5.5s linear infinite;
}
#ffLavaLampCanvas .ff-ring:nth-child(2)::after{animation-delay:-1.1s}
#ffLavaLampCanvas .ff-ring:nth-child(3)::after{animation-delay:-2.2s}
#ffLavaLampCanvas .ff-ring:nth-child(4)::after{animation-delay:-3.3s}
#ffLavaLampCanvas .ff-ring:nth-child(5)::after{animation-delay:-4.4s}
.ff-badges{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:0 20px;box-sizing:border-box;}
.ff-badge{width:162px;height:170px;display:flex;align-items:center;justify-content:center;}
.ff-badge img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
.ff-competition{display:flex;align-items:center;justify-content:center;min-height:76px;padding:14px 0 8px;box-sizing:border-box;}
.ff-comp-logo{display:block;height:90px;max-width:220px;width:auto;object-fit:contain;}

/* FF STEP 3 — reveal animations, scoped only to football cards */

/* Incoming and outgoing element reveals; the card/background/rings never slide. */
.ff-card.ff-active .ff-badge img{animation:ffBadgeReveal .34s cubic-bezier(.2,.8,.2,1) both;}
.ff-card.ff-exiting .ff-badge img{animation:ffBadgeExit .22s ease-in both;}
.ff-card.ff-active .ff-f1-logo,
.ff-card.ff-active .ff-boxing-logo{animation:ffHeroReveal .36s cubic-bezier(.2,.8,.2,1) .04s both;}
.ff-card.ff-exiting .ff-f1-logo,
.ff-card.ff-exiting .ff-boxing-logo{animation:ffHeroExit .22s ease-in both;}
.ff-card.ff-exiting .ff-comp-logo{animation:ffCompExit .22s ease-in both;}
.ff-card.ff-exiting .fixture{animation:ffTextExit .20s ease-in both;}
.ff-card.ff-exiting .time{animation:ffTextExit .18s ease-in both;}
.ff-card.ff-active .ff-badge:nth-child(1) img{animation-delay:.03s;}
.ff-card.ff-active .ff-badge:nth-child(2) img{animation-delay:.10s;}
.ff-card.ff-active .ff-comp-logo{animation:ffCompReveal .34s cubic-bezier(.2,.8,.2,1) .08s both;}
.ff-card.ff-active .fixture{animation:ffTextReveal .30s ease .12s both;}
.ff-card.ff-active .time{animation:ffTextReveal .28s ease .18s both;}
@keyframes ffSweepLight{to{transform:rotate(360deg)}}
@keyframes ffRingIlluminate{0%,100%{opacity:.2;filter:drop-shadow(0 0 0 transparent)}18%,38%{opacity:.88;filter:drop-shadow(0 0 5px var(--ring-b,#a000c7))}55%{opacity:.35;filter:drop-shadow(0 0 2px var(--ring-b,#a000c7))}}
@keyframes ffBadgeReveal{0%{opacity:0;transform:scale(.68)}100%{opacity:1;transform:scale(1)}}
@keyframes ffCompReveal{0%{opacity:0;transform:translateY(14px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ffTextReveal{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes ffBadgeExit{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.82)}}
@keyframes ffHeroReveal{0%{opacity:0;transform:scale(.90)}100%{opacity:1;transform:scale(1)}}
@keyframes ffHeroExit{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.94)}}
@keyframes ffCompExit{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-10px) scale(.94)}}
@keyframes ffTextExit{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-10px)}}
.ff-card .info{padding-top:0;gap:8px;text-align:center;}

.ff-card .versus{font-size:25px;line-height:1.1;}
.ff-card .time{font-size:35px;margin-top:20px}

/**************** FETCH DATA ****************/
async function fetchData() {

  try {

    const res =
      await fetch(API + "?_=" + Date.now());

    const data =
      await res.json();

    const newMatches =
      JSON.stringify(data.matches || []);

    const oldMatches =
      JSON.stringify(currentMatches || []);

    if (newMatches !== oldMatches) {

      lastUpdated = data.updated;

      imageVersion = data.updated;

      currentMatches = data.matches || [];

      latestEnglandWorldCup =
        data.englandWorldCup || null;

      // Only render normal sidebar
      // if takeover isn't active
      if(!worldCupTakeover){

        render(currentMatches);

lastSidebarIndex = -1;

      }

    }

  } catch (err) {

    console.error(
      "Fetch error:",
      err
    );

  }

}
/**************** TIME LOGIC ****************/
function calculateLabel(m){

  const now = Date.now() + serverOffset;

  if(now >= m.startTime && now <= m.endTime){
    return "LIVE NOW";
  }

  if(now < m.startTime && (m.startTime - now) <= 60*60*1000){

    const start = new Date(m.startTime);

    let hours = start.getHours();
    const minutes = start.getMinutes();

    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours ? hours : 12;

    if(minutes === 0){
      return `UP NEXT • ${hours}${ampm}`;
    }

    const padded =
      minutes.toString().padStart(2,"0");

    return `UP NEXT • ${hours}:${padded}${ampm}`;
  }

  return m.label;

}

/**************** RENDER ****************/
function render(matches) {
  const slider = document.getElementById("slider");
  slider.innerHTML = "";
  lastSidebarIndex = -1;

  matches.forEach((m, i) => {
    const displayLabel = calculateLabel(m);
    const card = document.createElement("div");
    const competitionName = String(m.competition || "");
    const isF1 = /\bF1\b|Formula 1/i.test(competitionName);
    const isBoxing = /boxing/i.test(competitionName);
    const isFootballFF = Boolean(m.away && (m.homeBadge || m.awayBadge));
    const useFFHeader = isFootballFF || isF1 || isBoxing;
    card.className = "card" + (useFFHeader ? " ff-card" : "") + (isF1 ? " ff-f1-card" : "") + (isBoxing ? " ff-boxing-card" : "");

    if (useFFHeader) {
      const competition = competitionName;
      // F1 has its own red rings; football retains competition-specific palettes.
      const ringPalette = isBoxing
        ? ["#000000", "#000000", "rgba(254,241,12,.22)"]
        : isF1
        ? ["#980000", "#f10000", "rgba(13,48,200,.24)"]
        : /champions league/i.test(competition)
        ? ["#0b0778", "#b300df", "rgba(179,0,223,.25)"]
        : /europa league/i.test(competition)
        ? ["#ff4d00", "#ff7000", "rgba(255,112,0,.25)"]
        : /conference league/i.test(competition)
        ? ["#000000", "#01be13", "rgba(1,190,19,.25)"]
        : /premier league/i.test(competition)
        ? ["#370343", "#fd0166", "rgba(253,1,102,.25)"]
        : /carabao cup/i.test(competition)
        ? ["#218757", "#349a6a", "rgba(52,154,106,.25)"]
        : /(fa cup)/i.test(competition)
        ? ["#a00000", "#cc0f13", "rgba(204,15,19,.25)"]
        : /championship/i.test(competition)
        ? ["#a00000", "#cc0f13", "rgba(204,15,19,.25)"]
        : /nations league/i.test(competition)
        ? ["#000000", "#01be13", "rgba(220,220,220,.08)"]
        : ["#180b65", "#a000c7", "rgba(65,0,100,.35)"];
      card.dataset.lavaA = isBoxing ? "#fef10c" : (isF1 ? "#082084" : ringPalette[0]);
      card.dataset.lavaB = isBoxing ? "#ded107" : (isF1 ? "#0d30c8" : ringPalette[1]);
      card.dataset.ringA = ringPalette[0];
      card.dataset.ringB = ringPalette[1];
      // Endpoint B resolves this GitHub SVG independently of the fixture's competition.
      const compLogo = isBoxing
        ? String(m.competitionLogo || "https://totalmixcreative.github.io/graphics/Football/Sidebar/Boxing_SB.svg")
        : isF1
        ? String(m.competitionLogo || "https://totalmixcreative.github.io/graphics/Football/Sidebar/F1_SB.svg")
        : String(m.competitionLogo || "");
      card.innerHTML = `
        <div class="ff-header ${isF1 ? "ff-f1-header" : ""} ${isBoxing ? "ff-boxing-header" : ""}" style="--ring-a:${ringPalette[0]};--ring-b:${ringPalette[1]};--ff-glow:${ringPalette[2]}">
          ${isBoxing
            ? `<img class="ff-boxing-logo" src="https://totalmixcreative.github.io/graphics/Football/Sidebar/Boxing.png" alt="Boxing">`
            : isF1
            ? `<img class="ff-f1-logo" src="https://totalmixcreative.github.io/graphics/Football/F1_Header.svg" alt="Formula 1">`
            : `<div class="ff-badges">
                <div class="ff-badge">${m.homeBadge ? `<img src="${m.homeBadge}" alt="${m.home || ''}">` : ""}</div>
                <div class="ff-badge">${m.awayBadge ? `<img src="${m.awayBadge}" alt="${m.away || ''}">` : ""}</div>
              </div>`}
        </div>
        <div class="info">
          ${compLogo ? `<div class="ff-competition"><img class="ff-comp-logo" src="${compLogo}" alt="${competition}" onerror="this.parentElement.style.display='none'"></div>` : `<div class="ff-competition competition fallback-text">${competition}</div>`}

            <div class="team home">${m.home || ""}</div>
            ${m.away ? `<div class="versus">v</div><div class="team away">${m.away}</div>` : ""}
          </div>
          <div class="time ${displayLabel === 'LIVE NOW' ? 'live' : ''}">
            ${displayLabel === 'LIVE NOW' ? '<span class="live-dot"></span>' : ''}${displayLabel || ""}
          </div>
        </div>`;
    } else {
      card.innerHTML = `
        <div class="team-img" style="background-image:url('${
          (m.homeImg || "").startsWith("http")
            ? m.homeImg
            : `https://drive.google.com/thumbnail?id=${m.homeImg}&sz=w1000&v=${imageVersion}`
        }')"></div>
        <div class="info">
          ${m.competitionImg ? `
            <div class="competition" data-competition="${m.competition}">
              <img src="${/\bF1\b|Formula 1/i.test(String(m.competition || "")) ? "https://totalmixcreative.github.io/graphics/Football/Sidebar/F1_SB.svg" : `https://drive.google.com/thumbnail?id=${m.competitionImg}&sz=w1000&v=${imageVersion}`}">

            ${displayLabel === 'LIVE NOW' ? '<span class="live-dot"></span>' : ''}${displayLabel || ""}
          </div>
        </div>`;
    }

    if (i === 0) card.classList.add("ff-current");
    slider.appendChild(card);
  });
}

const SIDEBAR_DURATION = 9000; // same timing you used

setInterval(()=>{

  const slider =
    document.getElementById("slider");

  const cards = slider.children;

  if(!cards.length) return;

  const globalIndex =
  Math.floor(getElapsedTime()/SIDEBAR_DURATION)
  % cards.length;

  if(globalIndex === lastSidebarIndex)
    return;

  lastSidebarIndex = globalIndex;

  /* Animate outgoing fixture elements, then reveal the next fixture in place. */
  const outgoingCard = Array.from(cards).find(card => card.classList.contains("ff-current"));
  if (outgoingCard && outgoingCard !== cards[globalIndex] && outgoingCard.classList.contains("ff-card")) {
    outgoingCard.classList.remove("ff-active");
    outgoingCard.classList.add("ff-exiting");
  }

  const nextCard = cards[globalIndex];
  const switchToNext = () => {
    Array.from(cards).forEach(card=>{
      card.classList.remove("ff-active", "ff-current", "ff-exiting");
    });
    nextCard.classList.add("ff-current");

    const lavaLayer = document.getElementById("ffLavaLampCanvas");
    if (lavaLayer) {
      if (nextCard.classList.contains("ff-card")) {
        lavaLayer.classList.add("is-visible");
        lavaLayer.style.setProperty("--lava-a", nextCard.dataset.lavaA || "#370343");
        lavaLayer.style.setProperty("--lava-b", nextCard.dataset.lavaB || "#fd0166");
        lavaLayer.style.setProperty("--ring-a", nextCard.dataset.ringA || "#180b65");
        lavaLayer.style.setProperty("--ring-b", nextCard.dataset.ringB || "#a000c7");
      } else {
        lavaLayer.classList.remove("is-visible");
      }
    }

    if(nextCard.classList.contains("ff-card")){
      /* Replay only the existing element-level entrance animations. */
      void nextCard.offsetWidth;
      nextCard.classList.add("ff-active");
    }
  };

  if (outgoingCard && outgoingCard !== nextCard && outgoingCard.classList.contains("ff-card")) {
    window.setTimeout(switchToNext, 230);
  } else {
    switchToNext();
  }

},250);

async function syncServerTime(){

  try{

    const res = await fetch(
      "https://timeapi.world/timezone/Europe/London"
    );

    const data = await res.json();

    const serverNow = new Date(data.datetime);
    const localNow = new Date();

    serverOffset = serverNow - localNow;

  }catch(e){

    console.log("Server time sync failed");

  }

}
    
async function init(){

  await syncServerTime();

  /* resync every 5 mins */
  setInterval(syncServerTime,300000);

  await fetchData();

  setInterval(fetchData,30000);

}
