<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

<style>

/* =================================
   BASE
================================= */

body{
  margin:0;
  background:transparent;
  font-family:'Google Sans', sans-serif;
}

/* =================================
   SHARED STRUCTURE
================================= */

.info-wrapper{
  position:absolute;
  text-align:center;
  white-space:nowrap;
  color:#111;
}

/* =================================
   LIVE INFO BLOCK
================================= */

.info-wrapper{
  position:absolute;
  text-align:center;
  white-space:nowrap;
  color:#111;
}

#time{
  font-family:'Google Sans', sans-serif;
  font-weight:700;
  font-size:50px;
  line-height:32px;
  letter-spacing:0;
}

#details{
  margin-top:17px;
  font-family:'Google Sans', sans-serif;
  font-weight:400;
  font-size:22px;
  line-height:22px;
  letter-spacing:0;
}

#weatherIcon{
  font-size:22px;
  vertical-align:-3px;
}

/* =================================
   DISPLAY POSITION
================================= */

.info-wrapper{
  top:35px;
  left:50%;
  width:235px;
  transform:translateX(-50%);
}

</style>
</head>

<body>

<div class="info-wrapper">

  <div id="time">00:00</div>

  <div id="details">
    <span id="date">Sat 26 Sep</span>
    <span>&nbsp;•&nbsp;</span>
    <span id="weatherIcon">☀</span>
    <span id="temperature">--°C</span>
  </div>

</div>

<script>

/* =================================
   SHARED DISPLAY
================================= */


/* =================================
   LIVE TIME + DATE
================================= */

function updateClock(){

  const now = new Date();

  const hours = now.getHours().toString().padStart(2,"0");
  const minutes = now.getMinutes().toString().padStart(2,"0");

  document.getElementById("time").textContent =
    `${hours}:${minutes}`;

  const dateText = now.toLocaleDateString("en-GB",{
    weekday:"short",
    day:"numeric",
    month:"short"
  });

  document.getElementById("date").textContent = dateText;
}

updateClock();
setInterval(updateClock,1000);


/* =================================
   WEATHER
   Open-Meteo
   Stowmarket, Suffolk
================================= */

const WEATHER_LAT = 52.1888;
const WEATHER_LON = 0.9978;

function weatherIcon(code){

  if(code === 0) return "☀";

  if(code === 1) return "🌤";
  if(code === 2) return "⛅";
  if(code === 3) return "☁";

  if(code === 45 || code === 48) return "🌫";

  if(code === 51 || code === 53 || code === 55) return "🌦";

  if(code === 56 || code === 57) return "🌧";

  if(code === 61 || code === 63 || code === 65) return "🌧";

  if(code === 66 || code === 67) return "🌧";

  if(code === 71 || code === 73 || code === 75 || code === 77) return "❄";

  if(code === 80 || code === 81 || code === 82) return "🌦";

  if(code === 85 || code === 86) return "🌨";

  if(code === 95) return "⛈";

  if(code === 96 || code === 99) return "⛈";

  return "☀";
}


async function updateWeather(){

  try{

    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${WEATHER_LAT}` +
      `&longitude=${WEATHER_LON}` +
      `&current=temperature_2m,weather_code` +
      `&temperature_unit=celsius` +
      `&timezone=Europe%2FLondon`;

    const response = await fetch(url, {
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error("Weather request failed");
    }

    const data = await response.json();

    const temperature =
      Math.round(data.current.temperature_2m);

    const code =
      data.current.weather_code;

    document.getElementById("temperature").textContent =
      `${temperature}°C`;

    document.getElementById("weatherIcon").textContent =
      weatherIcon(code);

  }catch(error){

    console.log("Weather unavailable:",error);

    document.getElementById("temperature").textContent =
      "--°C";

  }

}

/* Get weather immediately */
updateWeather();

/* Refresh weather every 10 minutes */
setInterval(updateWeather,10 * 60 * 1000);

</script>

</body>
</html>
