/* IMAGE WRAPPER (same role as text-wrapper) */

#promoWrapper{
  width:100%;
  height:100%;

  z-index:1;
}

#promoImage{

#promoContainer{
  position:absolute;
  inset:0;

#nightBumper{

/* ============================
NIGHT BUMPER
============================ */
	
#nightBumper{

  position:absolute;
  inset:0;

  z-index:99999;

  pointer-events:none;

  opacity:0;

}

#nightBumperText{

  font-family:
    'Robuck',
    sans-serif;

  font-size:220px;

  letter-spacing:8px;

}

#nightBumper.show{

  animation:
    nightBumperIn 0.7s
    cubic-bezier(0.2,0.8,0.2,1)
    forwards;

}

#nightBumper.hide{

  animation:
    nightBumperOut 0.6s ease forwards;

}
	
#nightBumperSVG{
  width:100%;
  height:100%;
}

@keyframes nightBumperIn{

  0%{
    opacity:0;
    transform:
      scale(0.8)
      translateY(60px);
  }

  60%{
    opacity:1;
    transform:
      scale(1.05)
      translateY(-10px);
  }

  100%{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }

}

@keyframes nightBumperOut{

  0%{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }

  100%{
    opacity:0;
    transform:
      scale(1.03)
      translateY(-20px);
  }

}

.slide-out{

  }

@keyframes promoFadeOut{

  }

/* ============================
   FOOTBALL LAYER — FF STYLING
   Change #2: CSS only
============================ */

#footballLayer{
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
  font-family:'League Gothic',Impact,sans-serif;
  text-transform:uppercase;
}

#footballLayer .slide{
  position:relative;
  width:1920px;
  height:1080px;
  overflow:hidden;
  background:
    radial-gradient(circle at var(--bg-x1,75%) var(--bg-y1,65%),
                    var(--bg-glow,rgba(75,35,120,.20)),transparent 42%),
    radial-gradient(circle at var(--bg-x2,35%) var(--bg-y2,20%),
                    var(--bg-secondary,rgba(25,55,100,.28)),transparent 50%),
    radial-gradient(circle at var(--bg-x3,50%) var(--bg-y3,80%),
                    var(--bg-secondary,rgba(25,55,100,.12)),transparent 55%),
    linear-gradient(135deg,var(--bg-start,#020205) 0%,var(--bg-mid,#070814) 55%,var(--bg-end,#010103) 100%);
  background-size:140% 140%,160% 160%,180% 180%;
  background-position:75% 65%,35% 20%,0% 50%;
  animation:footballHueDrift 10s ease-in-out infinite alternate;
  transform:scale(.814583);
  transform-origin:top left;
}

/* FF outer transitions are carried across unchanged for now. */
#footballLayer .slide.ps-slide-in{
  animation:psSlideIn .6s ease forwards;
}
#footballLayer .slide.ps-slide-out{
  animation:psSlideOut .6s ease forwards;
}
#footballLayer .slide.ps-fade-in{
  animation:psFadeIn .6s ease forwards;
}
#footballLayer .slide.ps-fade-out{
  animation:psFadeOut .6s ease forwards;
}

@keyframes psSlideIn{
  from{transform:translateX(-100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}
@keyframes psSlideOut{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(-100%);opacity:0;}
}
@keyframes psFadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes psFadeOut{
  from{opacity:1;}
  to{opacity:0;}
}

@keyframes footballHueDrift{
  0%{
    --bg-x1:72%;--bg-y1:68%;
    --bg-x2:30%;--bg-y2:18%;
    --bg-x3:55%;--bg-y3:82%;
    background-position:0% 0%,100% 0%,0% 100%,50% 50%;
  }
  50%{
    --bg-x1:82%;--bg-y1:52%;
    --bg-x2:42%;--bg-y2:30%;
    --bg-x3:42%;--bg-y3:68%;
    background-position:45% 55%,55% 45%,60% 35%,50% 50%;
  }
  100%{
    --bg-x1:64%;--bg-y1:78%;
    --bg-x2:24%;--bg-y2:12%;
    --bg-x3:62%;--bg-y3:88%;
    background-position:100% 100%,0% 100%,100% 0%,50% 50%;
  }
}

    linear-gradient(#000 0 0) padding-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;

    linear-gradient(#000 0 0) padding-box,
    linear-gradient(#000 0 0);

  transform:translate(-50%,-50%) scale(.05);

<script>

/* =========================
   OFFLINE CACHE
========================= */

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("sw.js")
      .then(() => {
        console.log("PS Service Worker registered");
      })
      .catch((error) => {
        console.log(
          "PS Service Worker registration failed:",
          error
        );
      });

  });

}


const BASE =
"https://totalmixcreative.github.io/graphics/promos/";

const IMAGE_DURATION = 10000;
const ANIMATION_DURATION = 600;
	
const TOTAL_DURATION = 10600;
const HOLD_DURATION = 10000;

const MASTER_EPOCH =
new Date("2026-01-01T00:00:00Z").getTime();

function getElapsedTime(){
  return Date.now() - MASTER_EPOCH;
}

let currentMedia = null;
let nightModeActive = false;
let specialEventType = null;
	
let specialEventActive = false;
let specialEventIndex = 0;

const SPECIAL_EVENT_MEDIA = {
  pit: [
	  "PitVis.mp4"
  ],
	
  ska: [
    "Ska-1.mp4"
  ],

  "90s": [
    "90s-1.mp4",
    "90s-2.mp4",
    "90s-3.mp4"
  ],

  trance: [
    "Trance-1.mp4"
  ]

};
	
let bumperActive = false;
let lastBumperTime = 0;
let nightHue = 0;
let lastTimestamp = null;
let currentTimeout = null;


	
window.addEventListener("message",(e)=>{

  /* =========================
     NIGHT MODE ON
  ========================= */

  if(e.data.type === "nightmode-on"){

    nightModeActive = true;

    specialEventType = e.data.specialEventType || null;
    specialEventActive = !!specialEventType;
    specialEventIndex = 0;
	  
	if(specialEventActive){
    playSpecialEvent();
}

    let venueText;

if(e.data.specialEvent){

  venueText = "CARBON";

}else{

  venueText = "THE NIGHT IS YOURS";

}

    document
      .getElementById("nightBumperText")
      .textContent =
        venueText;

    if(!e.data.silent){

      if(!bumperActive){

  showNightBumper();

}

    }

  }

  /* =========================
     NIGHT MODE OFF
  ========================= */

  if(e.data.type === "nightmode-off"){

    nightModeActive = false;
	  
	specialEventActive = false;
    specialEventType = null;
    specialEventIndex = 0;

    const venueText =
      e.data.venue === "mill"
        ? "THE MILL"
        : "CARBON";

    document
      .getElementById("nightBumperText")
      .textContent =
        venueText;

    showNightBumper();

  }

});


/* =========================
   SHOW NIGHT BUMPER
========================= */
	
function showNightBumper(){

  bumperActive = true;

  const bumper =
    document.getElementById("nightBumper");

  bumper.classList.remove("show");
  bumper.classList.remove("hide");

  void bumper.offsetWidth;

  bumper.classList.add("show");

  setTimeout(()=>{

    bumper.classList.remove("show");
    bumper.classList.add("hide");

  },3200);

  setTimeout(()=>{

    bumperActive = false;

  },4200);

}
	
/* =========================
   PLAY MEDIA
========================= */

function playAnimation(newMedia, loop = false, onEnded = null){

  const wrapper =
    document.getElementById("promoWrapper");

  const container =
    document.getElementById("promoContainer");

  /* CLEANUP */

  if(currentTimeout){
    clearTimeout(currentTimeout);
  }

  const oldVideo =
    container.querySelector("video");

  if(oldVideo){
    oldVideo.pause();
    oldVideo.src = "";
    oldVideo.load();
  }

  container.innerHTML = "";

  /* DETECT FILE TYPE */

  const ext =
    newMedia.split(".").pop().toLowerCase();

  let duration = IMAGE_DURATION;

  /* =========================
     VIDEO
  ========================= */

  if(ext === "mp4" || ext === "webm"){

    const video =
      document.createElement("video");

    video.src = BASE + newMedia;

    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.loop = loop;
	video.onended = onEnded;
    video.preload = "auto";

    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "cover";

    container.appendChild(video);

    video.onloadedmetadata = () => {

      duration =
        (video.duration * 1000)
        - ANIMATION_DURATION;

    };

  }

  /* =========================
     IMAGE
  ========================= */

  else{

  const img =
    document.createElement("img");

  img.onload = () => {

    container.innerHTML = "";

    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";

    container.appendChild(img);

  };

  img.src = BASE + newMedia;

}

  /* =========================
     ANIMATION IN
  ========================= */

  wrapper.className = "";

  void wrapper.offsetWidth;

  const screen =
  document.getElementById("screen");

wrapper.classList.add("slide-in");

}

/* =========================
   SPECIAL EVENT PLAYER
========================= */

function playSpecialEvent(){

  const mediaList =
    SPECIAL_EVENT_MEDIA[specialEventType];

  if(!mediaList || !mediaList.length){
    return;
  }

  const media =
    mediaList[specialEventIndex];

  if(mediaList.length === 1){

    playAnimation(
      media,
      true
    );

  }else{

    playAnimation(
      media,
      false,
      () => {

        showNightBumper();

        setTimeout(()=>{

          specialEventIndex =
            (specialEventIndex + 1)
            % mediaList.length;

          playSpecialEvent();

        },3000);

      }
    );

  }

}
	
const TEAM_ASSET_BASE =
  "https://totalmixcreative.github.io/graphics/Football/Normalised/";

const COMPETITION_BASE =
  "https://totalmixcreative.github.io/graphics/Football/";

const FOOTBALL_TEAMS = {
  "Arsenal":['PL','Arsenal.svg'],
  "Aston Villa":['PL','AstonVilla.svg'],
  "Bournemouth":['PL','Bournemouth.svg'],
  "Brentford":['PL','Brentford.svg'],
  "Brighton":['PL','Brighton.svg'],
  "Chelsea":['PL','Chelsea.svg'],

function mappedTeamName(name){
  return TEAM_ALIASES[name] || name;
}

function teamAsset(name){
  const key = mappedTeamName(name);
  const a = FOOTBALL_TEAMS[key];
  return a ? TEAM_ASSET_BASE + a[0] + "/" + a[1] : null;
}

function competitionAsset(name){
  if(!name) return null;
  if(COMPETITION_LOGOS[name]) return COMPETITION_BASE + COMPETITION_LOGOS[name];

  const n = name.toLowerCase();

  if(n.includes("premier")) return COMPETITION_BASE + "PremierLeague.svg";
  if(n.includes("championship")) return COMPETITION_BASE + "Championship.svg";
  if(n.includes("fa cup")) return COMPETITION_BASE + "FACup.svg";
  if(n.includes("carabao")) return COMPETITION_BASE + "CarabaoCup.svg";
  if(n.includes("champions league")) return COMPETITION_BASE + "UEFAChampionsLeague.svg";
  if(n.includes("europa league")) return COMPETITION_BASE + "UEFAEuropaLeague.svg";
  if(n.includes("conference league")) return COMPETITION_BASE + "UEFAConferenceLeague.svg";
  if(n.includes("nations league")) return COMPETITION_BASE + "UEFANationsLeague.svg";

  return null;
}

function setImg(el,url){
  el.innerHTML = url ? `<img src="${url}" alt="">` : "";
}

let fixtures = [];

function resetAnimationClasses(){
  const elements=[document.querySelector('#footballLayer .header h1'),document.querySelector('#footballLayer .header .underline'),document.getElementById('channelLogos'),document.getElementById('homeBadge'),document.getElementById('awayBadge'),document.getElementById('fixtureName'),document.getElementById('fixtureTime'),document.querySelector('#footballLayer .competition')];
  elements.forEach(el=>{if(el)el.classList.remove('play','exit')});
}

function replayFootballAnimations(){
  resetAnimationClasses();
  void document.body.offsetWidth;
  const elements=[document.querySelector('#footballLayer .header h1'),document.querySelector('#footballLayer .header .underline'),document.getElementById('channelLogos'),document.getElementById('homeBadge'),document.getElementById('awayBadge'),document.getElementById('fixtureName'),document.getElementById('fixtureTime'),document.querySelector('#footballLayer .competition')];
  elements.forEach(el=>{if(el)el.classList.add('play')});
}

function animateFootballOut(){
  const elements=[document.querySelector('#footballLayer .header h1'),document.querySelector('#footballLayer .header .underline'),document.getElementById('channelLogos'),document.getElementById('homeBadge'),document.getElementById('awayBadge'),document.getElementById('fixtureName'),document.getElementById('fixtureTime'),document.querySelector('#footballLayer .competition')];
  elements.forEach(el=>{if(el){void el.offsetWidth;el.classList.add('exit')}});
}

function render(f){
  const ringColours =
    COMPETITION_RING_COLOURS[f.competition] ||
    ["#ffffff","#ffffff"];

  const pulseField = document.querySelector("#footballLayer .pulse-field");
  pulseField.style.setProperty("--ring-start", ringColours[0]);
  pulseField.style.setProperty("--ring-end", ringColours[1]);

  const bg = COMPETITION_BACKGROUNDS[f.competition] || {
    start:"#020205", mid:"#070814", end:"#010103",
    secondary:"rgba(25,55,100,.24)", glow:"rgba(75,35,120,.16)"
  };

  const slide = document.querySelector("#footballLayer .slide");
  slide.style.setProperty("--bg-start", bg.start);
  slide.style.setProperty("--bg-mid", bg.mid);
  slide.style.setProperty("--bg-end", bg.end);
  slide.style.setProperty("--bg-secondary", bg.secondary);
  slide.style.setProperty("--bg-glow", bg.glow);

  setImg(document.getElementById("homeBadge"), teamAsset(f.home));
  setImg(document.getElementById("awayBadge"), teamAsset(f.away));

  document.getElementById("competitionHeader").textContent =
    f.competition || "";

  document.getElementById("fixtureName").textContent =
    `${f.home} V ${f.away}`;

  document.getElementById("fixtureTime").textContent =
    f.label || f.date || "";

  const channelLogos =
    Array.isArray(f.channelLogos)
      ? [...new Set(f.channelLogos)]
      : [];

  document.getElementById("channelLogos").innerHTML =
    channelLogos
      .map(url => `<img src="${url}" alt="">`)
      .join("");

  const compUrl = competitionAsset(f.competition);
  const comp = document.getElementById("competitionLogo");

  if(compUrl){
    comp.src = compUrl;
    comp.alt = f.competition || "";
  }else{
    comp.removeAttribute("src");
    comp.alt = "";
  }

  replayFootballAnimations();

}


/* =========================
   FOOTBALL INTEGRATION
   Change #3: FF render engine
========================= */

let currentFootballTimestamp = null;
let footballTransitionActive = false;

function setFootballVisible(visible){

  const footballLayer =
    document.getElementById("footballLayer");

  const promoWrapper =
    document.getElementById("promoWrapper");

  if(visible){

    footballLayer.style.opacity = "1";
    promoWrapper.style.visibility = "hidden";

  }else{

    footballLayer.style.opacity = "0";
    promoWrapper.style.visibility = "visible";

  }

}

function showFootballFixture(fixture){

  if(!fixture) return;

  setFootballVisible(true);

  render(fixture);

}

function hideFootballLayer(){

  setFootballVisible(false);

}


/* =========================
   UPDATE FROM STORAGE
========================= */

function updateFromStorage(){

  if(specialEventActive) return;

  const promo =
    JSON.parse(
      localStorage.getItem("currentPromo")
    );

  if(!promo) return;

  /* =========================
     FOOTBALL
  ========================= */

  if(promo.type === "football" && promo.fixture){

    if(promo.timestamp === currentFootballTimestamp){
      return;
    }

    const wasFootballActive =
      currentFootballTimestamp !== null;

    currentFootballTimestamp = promo.timestamp;

    currentMedia = null;
    lastTimestamp = promo.timestamp;

    /* =========================
       FOOTBALL -> FOOTBALL
       Fade completely to black,
       then load the next fixture.
    ========================= */

    if(wasFootballActive){

      animateFootballOut();

      const footballLayer =
        document.getElementById("footballLayer");

      const promoWrapper =
        document.getElementById("promoWrapper");

      footballLayer.style.opacity = "0";
      promoWrapper.style.visibility = "hidden";

      setTimeout(()=>{

        /* Ignore this transition if a newer
           Lower Thirds update has arrived. */

        const latestPromo =
          JSON.parse(
            localStorage.getItem("currentPromo")
          );

        if(
          !latestPromo ||
          latestPromo.type !== "football" ||
          latestPromo.timestamp !== currentFootballTimestamp
        ){
          return;
        }

        render(promo.fixture);
        footballLayer.style.opacity = "1";

      },600);

    }else{

      showFootballFixture(promo.fixture);

    }

    return;

  }

  /* =========================
     NORMAL PROMO
  ========================= */

  if(!promo.image) return;

  const nextMedia =
    Array.isArray(promo.image)
    ? promo.image[promo.imageIndex]
    : promo.image;

  if(!nextMedia) return;

  if(
    nextMedia === currentMedia &&
    promo.timestamp === lastTimestamp
  ){
    return;
  }

  lastTimestamp = promo.timestamp;

  currentMedia = nextMedia;

  const startNormalPromo = () => {

    playAnimation(nextMedia);

    const overlay =
      document.getElementById("promoOverlay");

    const overlayHeadline =
      document.getElementById(
        "promoOverlayHeadline"
      );

    const overlaySubline =
      document.getElementById(
        "promoOverlaySubline"
      );

    /* F1 DETECTION */

    if(
      promo.headline &&
      promo.headline.includes("Grand Prix")
    ){

      overlay.style.display = "block";

      overlayHeadline.textContent =
        promo.headline;

      const headlineLength =
        promo.headline.length;

      if(headlineLength > 40){

        overlayHeadline.style.fontSize =
          "72px";

      }else if(headlineLength > 28){

        overlayHeadline.style.fontSize =
          "88px";

      }else{

        overlayHeadline.style.fontSize =
          "110px";

      }

      overlaySubline.textContent =
        promo.subline;

    }else{

      overlay.style.display = "none";

    }

  };

  if(currentFootballTimestamp !== null){

    const footballLayer =
      document.getElementById("footballLayer");

    const promoWrapper =
      document.getElementById("promoWrapper");

    /* First let the FF elements perform their 600ms exit. */
    animateFootballOut();

    /* Keep the football layer fully visible during that exit. */
    footballLayer.style.opacity = "1";
    promoWrapper.style.visibility = "hidden";

    currentFootballTimestamp = null;
    footballTransitionActive = true;

    setTimeout(()=>{

      /* Then fade the complete football layer to black. */
      footballLayer.style.opacity = "0";

      setTimeout(()=>{

        /* Only reveal the normal promo after the FF layer has
           completely faded away. */
        promoWrapper.style.visibility = "visible";
        startNormalPromo();

        /* Keep the master 250ms transition timer from
           immediately cancelling this fresh fade-in. */
        setTimeout(()=>{
          footballTransitionActive = false;
        },700);

      },600);

    },600);

    return;

  }

  currentFootballTimestamp = null;
  hideFootballLayer();
  startNormalPromo();

}

    updateFromStorage();

});
