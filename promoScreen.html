<!DOCTYPE html>
<html>
<head>
	
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
rel="stylesheet">
	
<meta charset="UTF-8">

<style>

body{
  margin:0;
  overflow:hidden;
  background:#111;
}

#screen{
  width:1564px;
  height:880px;
  position:relative;
  overflow:hidden;
}

/* IMAGE WRAPPER (same role as text-wrapper) */

#promoWrapper{
  width:100%;
  height:100%;
  position:absolute;
}

#promoImage{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== SAME ANIMATION AS LOWER THIRDS ===== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{
    transform:translateX(-100%);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes slideOut{
  from{
    transform:translateX(0);
    opacity:1;
  }
  to{
    transform:translateX(-100%);
    opacity:0;
  }
}
	
#promoOverlay{

  position:absolute;

  left:80px;
  bottom:70px;

  z-index:20;

  color:white;

  text-shadow:
    0 4px 20px rgba(0,0,0,0.7);

  display:none;

}

#promoOverlayHeadline{

  font-family:
    'Bebas Neue',
    sans-serif;

  font-size:110px;

  line-height:0.9;

  letter-spacing:2px;

}

#promoOverlaySubline{

  margin-top:1.5px;

  font-family:
    'Bebas Neue',
    sans-serif;

  font-size:46px;

  letter-spacing:3px;

  opacity:0.9;

}

</style>
</head>

<body>

<div id="screen">

  <div id="promoWrapper">

   <div id="promoContainer"></div>

   <div id="promoOverlay">

      <div id="promoOverlayHeadline"></div>

      <div id="promoOverlaySubline"></div>

   </div>

</div>

</div>

<script>

const BASE =
"https://totalmixcreative.github.io/graphics/promos/";

const IMAGE_DURATION = 10000;
const ANIMATION_DURATION = 600;

let currentMedia = null;
let lastTimestamp = null;
let currentTimeout = null;

const TOTAL_DURATION = 10600;
const HOLD_DURATION = 10000;

const MASTER_EPOCH =
new Date("2026-01-01T00:00:00Z").getTime();

function getElapsedTime(){
  return Date.now() - MASTER_EPOCH;
}	
	
/* =========================
   PLAY MEDIA
========================= */

function playAnimation(newMedia){

  const wrapper =
    document.getElementById("promoWrapper");

  const container =
    document.getElementById("promoContainer");

  /* CLEANUP */

  if(currentTimeout){
    clearTimeout(currentTimeout);
  }

  const oldVideo =
    container.querySelector("video");

  if(oldVideo){
    oldVideo.pause();
    oldVideo.src = "";
    oldVideo.load();
  }

  container.innerHTML = "";

  /* DETECT FILE TYPE */

  const ext =
    newMedia.split(".").pop().toLowerCase();

  let duration = IMAGE_DURATION;

  /* =========================
     VIDEO
  ========================= */

  if(ext === "mp4" || ext === "webm"){

    const video =
      document.createElement("video");

    video.src = BASE + newMedia;

    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.loop = false;
    video.preload = "auto";

    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "cover";

    container.appendChild(video);

    video.onloadedmetadata = () => {

      duration =
        (video.duration * 1000)
        - ANIMATION_DURATION;

    };

  }

  /* =========================
     IMAGE
  ========================= */

  else{

    const img =
      document.createElement("img");

    img.src = BASE + newMedia;

    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";

    container.appendChild(img);

  }

  /* =========================
     ANIMATION IN
  ========================= */

  wrapper.className = "";

  void wrapper.offsetWidth;

  wrapper.classList.add("slide-in");

}

/* =========================
   UPDATE FROM STORAGE
========================= */

function updateFromStorage(){

  const promo =
    JSON.parse(
      localStorage.getItem("currentPromo")
    );

  if(!promo || !promo.image) return;

  const nextMedia =
    Array.isArray(promo.image)
    ? promo.image[promo.imageIndex]
    : promo.image;

  if(!nextMedia) return;

  if(
    nextMedia === currentMedia &&
    promo.timestamp === lastTimestamp
  ){
    return;
  }

  lastTimestamp = promo.timestamp;

  currentMedia = nextMedia;

  playAnimation(nextMedia);
	
	const overlay =
  document.getElementById("promoOverlay");

const overlayHeadline =
  document.getElementById(
    "promoOverlayHeadline"
  );

const overlaySubline =
  document.getElementById(
    "promoOverlaySubline"
  );

/* F1 DETECTION */

if(

  promo.headline &&
  promo.headline.includes("Grand Prix")

){

  overlay.style.display = "block";

  overlayHeadline.textContent =
    promo.headline;
	
const headlineLength =
  promo.headline.length;

if(headlineLength > 40){

  overlayHeadline.style.fontSize =
    "72px";

}else if(headlineLength > 28){

  overlayHeadline.style.fontSize =
    "88px";

}else{

  overlayHeadline.style.fontSize =
    "110px";

}

  overlaySubline.textContent =
    promo.subline;

}else{

  overlay.style.display = "none";

}

}

	
setInterval(()=>{

  const wrapper =
    document.getElementById("promoWrapper");

  const elapsedInCycle =
    getElapsedTime() % TOTAL_DURATION;

  if(
    elapsedInCycle >= HOLD_DURATION &&
    !wrapper.classList.contains("slide-out")
  ){

    wrapper.classList.remove("slide-in");

    wrapper.classList.add("slide-out");

  }

},250);

/* =========================
   STORAGE SYNC
========================= */

window.addEventListener("storage",(e)=>{

  if(e.key === "currentPromo"){

    updateFromStorage();

  }

});

/* =========================
   STARTUP
========================= */

updateFromStorage();

/* =========================
   FALLBACK POLLING
========================= */

setInterval(updateFromStorage,500);

</script>

</body>

</html>
