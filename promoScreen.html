<!DOCTYPE html>
<html>
<head>
	
	
<meta charset="UTF-8">

<style>

body{
  margin:0;
  overflow:hidden;
  background:#111;
}

#screen{
  width:1564px;
  height:880px;
  position:relative;
  overflow:hidden;
}

/* IMAGE WRAPPER (same role as text-wrapper) */

#promoWrapper{
  width:100%;
  height:100%;
  position:absolute;
}

#promoImage{
  width:100%;
  height:100%;
  object-fit:cover;
}
	
#travelWrapper{
  position:absolute;
	top:0;
	left:0;
	right:0;
	bottom:0;
	display:none;
	overflow:hidden;
}
	
	#travelWrapper iframe{
		position:absolute;
		top:0;
		left:0;
		width:100%;
		height:100%;
		border:0;
		display:block;
	}

/* ===== SAME ANIMATION AS LOWER THIRDS ===== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{
    transform:translateX(-100%);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes slideOut{
  from{
    transform:translateX(0);
    opacity:1;
  }
  to{
    transform:translateX(-100%);
    opacity:0;
  }
}

</style>
</head>

<body>

<div id="screen">

  <div id="promoWrapper">
      <img id="promoImage">
  </div>

  <div id="travelWrapper">
      <iframe src="travel.html"></iframe>
  </div>

</div>

<script>

const BASE =
"https://totalmixcreative.github.io/graphics/promos/";

const HOLD_DURATION=6000;
const ANIMATION_DURATION=600;

let currentImage=null;
let serverOffset = 0;
let currentMode = "promo";


function playAnimation(newImage){

  const wrapper = document.getElementById("promoWrapper");
  const img = document.getElementById("promoImage");

  const preload = new Image();

  preload.onload = () => {

    img.src = preload.src;

    wrapper.className="";
    wrapper.classList.add("slide-in");

    setTimeout(()=>{
      wrapper.classList.remove("slide-in");
      wrapper.classList.add("slide-out");
    }, HOLD_DURATION);

  };

  preload.src = BASE + newImage;

}

function updateFromStorage(){

  const travelState =
  JSON.parse(localStorage.getItem("travelState"));

if(travelState && travelState.active){

  if(currentMode !== "travel"){

    const promo = document.getElementById("promoWrapper");
const travel = document.getElementById("travelWrapper");

promo.classList.remove("slide-in");
promo.classList.add("slide-out");

setTimeout(()=>{
  promo.style.display="none";
  travel.style.display="block";

  travel.classList.remove("slide-out");
  travel.classList.add("slide-in");
},600);

    currentMode="travel";

  }

  return;

}
	
	if(currentMode === "travel"){

  const promo = document.getElementById("promoWrapper");
const travel = document.getElementById("travelWrapper");

travel.classList.remove("slide-in");
travel.classList.add("slide-out");

setTimeout(()=>{
  travel.style.display="none";
  promo.style.display="block";

  promo.classList.remove("slide-out");
  promo.classList.add("slide-in");
},600);

  currentMode="promo";

}
	
  const promo =
    JSON.parse(localStorage.getItem("currentPromo"));

  if(!promo || !promo.image) return;

  /* APPLY SERVER OFFSET FIRST */

  serverOffset = promo.serverOffset || 0;

  const nextImage =
  Array.isArray(promo.image)
  ? promo.image[promo.imageIndex]
  : promo.image;

  if(!nextImage) return;

  if(nextImage === currentImage) return;

  currentImage = nextImage;

  playAnimation(nextImage);

}

/* INSTANT SYNC */
window.addEventListener("storage",(e)=>{
  if(e.key==="currentPromo" || e.key==="travelState"){
    updateFromStorage();
  }
});

/* startup */
updateFromStorage();

/* KEEP IN SYNC WITH LT */
setInterval(updateFromStorage,500);
	
	
</script>

</body>

</html>
