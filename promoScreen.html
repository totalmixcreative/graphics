<!DOCTYPE html>
<html>
<head>
	
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link rel="preload" href="robuck-regular.otf" as="font" type="font/otf" crossorigin>	
	
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
rel="stylesheet">
	
<meta charset="UTF-8">

<style>
	
@font-face {
  font-family: 'Robuck';
  src: url('robuck-regular.otf') format('opentype');
}

body{
  margin:0;
  overflow:hidden;
  background:#111;
}

#screen{
  width:1564px;
  height:880px;
  position:relative;
  overflow:hidden;
}

/* IMAGE WRAPPER (same role as text-wrapper) */

#promoWrapper{
  width:100%;
  height:100%;
  position:absolute;
}

#promoImage{
  width:100%;
  height:100%;
  object-fit:cover;
}
	
#promoContainer{
  position:absolute;
  inset:0;
  z-index:1;
}

#nightBumper{
  z-index:99999;
}	
	
/* ============================
NIGHT BUMPER
============================ */
	
#nightBumper{

  position:absolute;
  inset:0;

  z-index:99999;

  pointer-events:none;

  opacity:0;

}

#nightBumperText{

  font-family:
    'Robuck',
    sans-serif;

  font-size:220px;

  letter-spacing:8px;

}

#nightBumper.show{

  animation:
    nightBumperIn 0.7s
    cubic-bezier(0.2,0.8,0.2,1)
    forwards;

}

#nightBumper.hide{

  animation:
    nightBumperOut 0.6s ease forwards;

}
	
#nightBumperSVG{
  width:100%;
  height:100%;
}

@keyframes nightBumperIn{

  0%{
    opacity:0;
    transform:
      scale(0.8)
      translateY(60px);
  }

  60%{
    opacity:1;
    transform:
      scale(1.05)
      translateY(-10px);
  }

  100%{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }

}

@keyframes nightBumperOut{

  0%{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }

  100%{
    opacity:0;
    transform:
      scale(1.03)
      translateY(-20px);
  }

}

/* ===== SAME ANIMATION AS LOWER THIRDS ===== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

	
@keyframes slideIn{
  from{
    transform:translateX(-100%);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes slideOut{
  from{
    transform:translateX(0);
    opacity:1;
  }
  to{
    transform:translateX(-100%);
    opacity:0;
  }
}
	
#promoOverlay{

  position:absolute;

  left:80px;
  bottom:70px;

  z-index:20;

  color:white;

  text-shadow:
    0 4px 20px rgba(0,0,0,0.7);

  display:none;

}

#promoOverlayHeadline{

  font-family:
    'Bebas Neue',
    sans-serif;

  font-size:110px;

  line-height:0.9;

  letter-spacing:2px;

}

#promoOverlaySubline{

  margin-top:1.5px;

  font-family:
    'Bebas Neue',
    sans-serif;

  font-size:46px;

  letter-spacing:3px;

  opacity:0.9;

}

</style>
</head>

<body>

<div id="screen">
	  
	  <div id="nightBumper">

<svg
  id="nightBumperSVG"
  width="100%"
  height="100%"
  viewBox="0 0 1920 1080">

<defs>

<linearGradient id="nightGrad">

  <animate
    attributeName="x1"
    values="0%;100%;0%"
    dur="20s"
    repeatCount="indefinite"/>

  <animate
    attributeName="x2"
    values="100%;0%;100%"
    dur="20s"
    repeatCount="indefinite"/>

  <stop
    id="nightGradStart"
    offset="0%"
    stop-color="#ff2a8a"/>

  <stop
    id="nightGradEnd"
    offset="100%"
    stop-color="#ff7a18"/>

</linearGradient>

</defs>

<rect
  width="100%"
  height="100%"
  fill="url(#nightGrad)"/>

<text
  id="nightBumperText"
  x="50%"
  y="50%"
  text-anchor="middle"
  dominant-baseline="middle"
  font-size="170"
  font-family="Robuck"
  fill="white"
  letter-spacing="4">

  CARBON NIGHTS

</text>

</svg>

</div>
	
<div id="promoWrapper">

   <div id="promoContainer"></div>

   <div id="promoOverlay">

      <div id="promoOverlayHeadline"></div>

      <div id="promoOverlaySubline"></div>

   </div>

</div>

</div>

<script>

const BASE =
"https://totalmixcreative.github.io/graphics/promos/";

const IMAGE_DURATION = 10000;
const ANIMATION_DURATION = 600;
	
const TOTAL_DURATION = 10600;
const HOLD_DURATION = 10000;

const MASTER_EPOCH =
new Date("2026-01-01T00:00:00Z").getTime();

function getElapsedTime(){
  return Date.now() - MASTER_EPOCH;
}

let currentMedia = null;
let nightModeActive = false;
let bumperActive = false;
let lastBumperTime = 0;
let nightHue = 0;
let lastTimestamp = null;
let currentTimeout = null;


	
window.addEventListener("message",(e)=>{

  /* =========================
     NIGHT MODE ON
  ========================= */

  if(e.data.type === "nightmode-on"){

    nightModeActive = true;

    let venueText;

if(e.data.specialEvent){

  venueText = "CARBON";

}else{

  venueText =
    e.data.venue === "mill"
      ? "MILL NIGHTS"
      : "CARBON NIGHTS";

}

    document
      .getElementById("nightBumperText")
      .textContent =
        venueText;

    if(!e.data.silent){

      if(!bumperActive){

  showNightBumper();

}

    }

  }

  /* =========================
     NIGHT MODE OFF
  ========================= */

  if(e.data.type === "nightmode-off"){

    nightModeActive = false;

    const venueText =
      e.data.venue === "mill"
        ? "THE MILL"
        : "CARBON";

    document
      .getElementById("nightBumperText")
      .textContent =
        venueText;

    showNightBumper();

  }

});


/* =========================
   SHOW NIGHT BUMPER
========================= */
	
function showNightBumper(){

  bumperActive = true;

  const bumper =
    document.getElementById("nightBumper");

  bumper.classList.remove("show");
  bumper.classList.remove("hide");

  void bumper.offsetWidth;

  bumper.classList.add("show");

  setTimeout(()=>{

    bumper.classList.remove("show");
    bumper.classList.add("hide");

  },3200);

  setTimeout(()=>{

    bumperActive = false;

  },4200);

}
	
/* =========================
   PLAY MEDIA
========================= */

function playAnimation(newMedia){

  const wrapper =
    document.getElementById("promoWrapper");

  const container =
    document.getElementById("promoContainer");

  /* CLEANUP */

  if(currentTimeout){
    clearTimeout(currentTimeout);
  }

  const oldVideo =
    container.querySelector("video");

  if(oldVideo){
    oldVideo.pause();
    oldVideo.src = "";
    oldVideo.load();
  }

  container.innerHTML = "";

  /* DETECT FILE TYPE */

  const ext =
    newMedia.split(".").pop().toLowerCase();

  let duration = IMAGE_DURATION;

  /* =========================
     VIDEO
  ========================= */

  if(ext === "mp4" || ext === "webm"){

    const video =
      document.createElement("video");

    video.src = BASE + newMedia;

    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.loop = false;
    video.preload = "auto";

    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "cover";

    container.appendChild(video);

    video.onloadedmetadata = () => {

      duration =
        (video.duration * 1000)
        - ANIMATION_DURATION;

    };

  }

  /* =========================
     IMAGE
  ========================= */

  else{

  const img =
    document.createElement("img");

  img.onload = () => {

    container.innerHTML = "";

    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";

    container.appendChild(img);

  };

  img.src = BASE + newMedia;

}

  /* =========================
     ANIMATION IN
  ========================= */

  wrapper.className = "";

  void wrapper.offsetWidth;

  const screen =
  document.getElementById("screen");

wrapper.classList.add("slide-in");

}

/* =========================
   UPDATE FROM STORAGE
========================= */

function updateFromStorage(){

  const promo =
    JSON.parse(
      localStorage.getItem("currentPromo")
    );

  if(!promo || !promo.image) return;

	
const nextMedia =
    Array.isArray(promo.image)
    ? promo.image[promo.imageIndex]
    : promo.image;

  if(!nextMedia) return;

  if(
    nextMedia === currentMedia &&
    promo.timestamp === lastTimestamp
  ){
    return;
  }

  lastTimestamp = promo.timestamp;

  currentMedia = nextMedia;

  playAnimation(nextMedia);
	
	const overlay =
  document.getElementById("promoOverlay");

const overlayHeadline =
  document.getElementById(
    "promoOverlayHeadline"
  );

const overlaySubline =
  document.getElementById(
    "promoOverlaySubline"
  );

/* F1 DETECTION */

if(

  promo.headline &&
  promo.headline.includes("Grand Prix")

){

  overlay.style.display = "block";

  overlayHeadline.textContent =
    promo.headline;
	
const headlineLength =
  promo.headline.length;

if(headlineLength > 40){

  overlayHeadline.style.fontSize =
    "72px";

}else if(headlineLength > 28){

  overlayHeadline.style.fontSize =
    "88px";

}else{

  overlayHeadline.style.fontSize =
    "110px";

}

  overlaySubline.textContent =
    promo.subline;

}else{

  overlay.style.display = "none";

}

}

	
setInterval(()=>{


  const wrapper =
  document.getElementById("promoWrapper");

const elapsedInCycle =
  getElapsedTime() % TOTAL_DURATION;

if(
  elapsedInCycle >= HOLD_DURATION &&
  elapsedInCycle < TOTAL_DURATION - 200 &&
  !wrapper.classList.contains("slide-out")
){

  if(
    nightModeActive &&
    !bumperActive
  ){

    showNightBumper();

  }

  wrapper.classList.remove("slide-in");

  wrapper.classList.add("slide-out");

}

},250);
	
setInterval(()=>{

  nightHue =
    (nightHue + 1) % 360;

  const color1 =
    `hsl(${nightHue},90%,55%)`;

  const color2 =
    `hsl(${(nightHue+40)%360},90%,55%)`;

  if(bumperActive){

    document
      .getElementById("nightGradStart")
      .setAttribute(
        "stop-color",
        color1
      );

    document
      .getElementById("nightGradEnd")
      .setAttribute(
        "stop-color",
        color2
      );

  }

},100);

/* =========================
   STORAGE SYNC
========================= */

window.addEventListener("storage",(e)=>{

  if(e.key === "currentPromo"){

    updateFromStorage();

  }

});

/* =========================
   STARTUP
========================= */

updateFromStorage();

/* =========================
   FALLBACK POLLING
========================= */

setInterval(updateFromStorage,500);

</script>

</body>

</html>
