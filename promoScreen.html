<!DOCTYPE html>
<html>
<head>
	
	
<meta charset="UTF-8">

<style>

body{
  margin:0;
  overflow:hidden;
  background:#111;
}

#screen{
  width:1564px;
  height:880px;
  position:relative;
  overflow:hidden;
}

/* IMAGE WRAPPER (same role as text-wrapper) */

#promoWrapper{
  width:100%;
  height:100%;
  position:absolute;
}

#promoImage{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== SAME ANIMATION AS LOWER THIRDS ===== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{
    transform:translateX(-100%);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes slideOut{
  from{
    transform:translateX(0);
    opacity:1;
  }
  to{
    transform:translateX(-100%);
    opacity:0;
  }
}

</style>
</head>

<body>

<div id="screen">

  <div id="promoWrapper">
   <div id="promoContainer"></div>
</div>

</div>

<script>

const BASE =
"https://totalmixcreative.github.io/graphics/promos/";

const IMAGE_DURATION = 6000;
const ANIMATION_DURATION = 600;

let currentMedia = null;
let lastTimestamp = null;
let currentTimeout = null;

/* =========================
   PLAY MEDIA
========================= */

function playAnimation(newMedia){

  const wrapper =
    document.getElementById("promoWrapper");

  const container =
    document.getElementById("promoContainer");

  /* CLEANUP */

  if(currentTimeout){
    clearTimeout(currentTimeout);
  }

  const oldVideo =
    container.querySelector("video");

  if(oldVideo){
    oldVideo.pause();
    oldVideo.src = "";
    oldVideo.load();
  }

  container.innerHTML = "";

  /* DETECT FILE TYPE */

  const ext =
    newMedia.split(".").pop().toLowerCase();

  let duration = IMAGE_DURATION;

  /* =========================
     VIDEO
  ========================= */

  if(ext === "mp4" || ext === "webm"){

    const video =
      document.createElement("video");

    video.src = BASE + newMedia;

    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.loop = false;
    video.preload = "auto";

    video.style.width = "100%";
    video.style.height = "100%";
    video.style.objectFit = "cover";

    container.appendChild(video);

    video.onloadedmetadata = () => {

      duration =
        (video.duration * 1000)
        - ANIMATION_DURATION;

      currentTimeout = setTimeout(()=>{

        wrapper.classList.remove("slide-in");
        wrapper.classList.add("slide-out");

      }, duration);

    };

  }

  /* =========================
     IMAGE
  ========================= */

  else{

    const img =
      document.createElement("img");

    img.src = BASE + newMedia;

    img.style.width = "100%";
    img.style.height = "100%";
    img.style.objectFit = "cover";

    container.appendChild(img);

    currentTimeout = setTimeout(()=>{

      wrapper.classList.remove("slide-in");
      wrapper.classList.add("slide-out");

    }, IMAGE_DURATION);

  }

  /* =========================
     ANIMATION IN
  ========================= */

  wrapper.className = "";

  void wrapper.offsetWidth;

  wrapper.classList.add("slide-in");

}

/* =========================
   UPDATE FROM STORAGE
========================= */

function updateFromStorage(){

  const promo =
    JSON.parse(
      localStorage.getItem("currentPromo")
    );

  if(!promo || !promo.image) return;

  const nextMedia =
    Array.isArray(promo.image)
    ? promo.image[promo.imageIndex]
    : promo.image;

  if(!nextMedia) return;

  if(
    nextMedia === currentMedia &&
    promo.timestamp === lastTimestamp
  ){
    return;
  }

  lastTimestamp = promo.timestamp;

  currentMedia = nextMedia;

  playAnimation(nextMedia);

}

/* =========================
   STORAGE SYNC
========================= */

window.addEventListener("storage",(e)=>{

  if(e.key === "currentPromo"){

    updateFromStorage();

  }

});

/* =========================
   STARTUP
========================= */

updateFromStorage();

/* =========================
   FALLBACK POLLING
========================= */

setInterval(updateFromStorage,500);

</script>

</body>

</html>
