<!DOCTYPE html>
<html>
<head>
	
	
<meta charset="UTF-8">

<style>

body{
  margin:0;
  overflow:hidden;
  background:#111;
}

#screen{
  width:1564px;
  height:880px;
  position:relative;
  overflow:hidden;
}

/* IMAGE WRAPPER (same role as text-wrapper) */

#promoWrapper{
  width:100%;
  height:100%;
  position:absolute;
}

#promoImage{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ===== SAME ANIMATION AS LOWER THIRDS ===== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{
    transform:translateX(-100%);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

@keyframes slideOut{
  from{
    transform:translateX(0);
    opacity:1;
  }
  to{
    transform:translateX(-100%);
    opacity:0;
  }
}

</style>
</head>

<body>

<div id="screen">

  <div id="promoWrapper">
   <div id="promoContainer"></div>
</div>

</div>

<script>

const BASE =
"https://totalmixcreative.github.io/graphics/promos/";

const HOLD_DURATION=6000;
const ANIMATION_DURATION=600;

let currentImage=null;
let serverOffset = 0;
let lastTimestamp = null;


function playAnimation(newImage){

  const wrapper = document.getElementById("promoWrapper");
  const container =
document.getElementById("promoContainer");

container.innerHTML = "";

const ext =
newImage.split('.').pop().toLowerCase();

if(ext === "mp4"){

  const video =
    document.createElement("video");

  video.src = BASE + newImage;

  video.autoplay = true;
  video.muted = true;
  video.playsInline = true;
  video.loop = false;

  video.style.width = "100%";
  video.style.height = "100%";
  video.style.objectFit = "cover";

  container.appendChild(video);

}else{

  const img =
    document.createElement("img");

  img.src = BASE + newImage;

  img.style.width = "100%";
  img.style.height = "100%";
  img.style.objectFit = "cover";

  container.appendChild(img);

}

wrapper.className="";
wrapper.classList.add("slide-in");

setTimeout(()=>{

  wrapper.classList.remove("slide-in");
  wrapper.classList.add("slide-out");

}, HOLD_DURATION);

}

function updateFromStorage(){
	
  const promo =
    JSON.parse(localStorage.getItem("currentPromo"));

  if(!promo || !promo.image) return;

  /* APPLY SERVER OFFSET FIRST */

  serverOffset = promo.serverOffset || 0;

  const nextImage =
  Array.isArray(promo.image)
  ? promo.image[promo.imageIndex]
  : promo.image;

  if(!nextImage) return;

  if(
  nextImage === currentImage &&
  promo.timestamp === lastTimestamp
){
  return;
}

lastTimestamp = promo.timestamp;

  currentImage = nextImage;

  playAnimation(nextImage);

}

/* INSTANT SYNC */
window.addEventListener("storage",(e)=>{
  if(e.key==="currentPromo"){
    updateFromStorage();
  }
});

/* startup */
updateFromStorage();

/* KEEP IN SYNC WITH LT */
setInterval(updateFromStorage,500);
	
	
</script>

</body>

</html>
