<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Travel Signage - Weekend Rail</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
color:white;
font-family:'Google Sans', Arial, Helvetica, sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
background:#111;
}

.travel-item{
  font-size:40px;
  margin:20px 0;
}

#box{
  z-index:2;
}

h1{
  font-size:70px;
  margin-bottom:40px;
}

#background{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-size:cover;
background-position:center;
z-index:0;
}

#overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:1;
}

</style>
</head>

<body>

<div id="background"></div>
<div id="overlay"></div>

<div id="box"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";

let slides = [];
let currentSlide = 0;

// =========================
// BACKGROUND (WEEKEND CUSTOM)
// =========================
document.getElementById("background").style.backgroundImage =
  "url('https://totalmixcreative.github.io/graphics/Background/ga.png')";

// =========================
// FETCH (RAIL ONLY)
// =========================
async function loadTravel(){

  try{
    const res = await fetch(API + "?t=" + Date.now());
    const data = await res.json();

    const slidesData = data.travel || {};
    const allSlides = slidesData.slides || [];

    // 👇 ONLY KEEP RAIL SLIDES
    slides = allSlides.filter(slide =>
      slide.some(item => item.includes("🚆"))
    );

    // fallback
    if(!slides.length){
      slides = [["Greater Anglia – No reported delays"]];
    }

  }catch(e){
    console.log("Travel fetch failed", e);
  }

}

// =========================
// FORMAT
// =========================
function formatItem(text){

  if(text.toLowerCase().includes("no reported")){
    return "Greater Anglia – No reported delays";
  }

  return text.replace("🚆 ", "");
}

// =========================
// RENDER
// =========================
function render(){

  const box = document.getElementById("box");

  const slide = slides[currentSlide] || [];

  box.innerHTML = `<h1>Rail Travel</h1>`;

  slide.forEach(item => {

    const div = document.createElement("div");
    div.className = "travel-item";

    div.textContent = formatItem(item);

    box.appendChild(div);

  });

}

// =========================
// CLOCK LOOP
// =========================
setInterval(() => {
  render();
}, 1000);

// =========================
// INIT
// =========================
loadTravel();
setInterval(loadTravel, 300000);

// 👇 SHORT WEEKEND TIMING
const SLIDE_TIME = 15000;

setInterval(() => {

  if(slides.length > 1){
    currentSlide = (currentSlide + 1) % slides.length;
  }

}, SLIDE_TIME);

</script>

</body>
</html>
