<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carbon Lower Third</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:'Google Sans', Arial, Helvetica, sans-serif;
}

/* ===============================
   TOP BANNER
=============================== */

#banner{
  position:absolute;
  top:0;
  width:100%;
  height:220px;
  overflow:hidden;
}

/* ===============================
   CONTENT AREA
=============================== */

#content{
  position:absolute;
  top:40px;
  left:80px;
}

/* TEXT */

#text-wrapper{
  position:relative;
  z-index:2;
  color:white;

  margin-left:300px; /* ← PUSH TEXT RIGHT */
}

#headline{
  font-size:50px;
  font-weight:700;
  margin:0;
  line-height:1.1;
}

#subline{
  font-size:36px;
  margin-top:6px;
}

/* ===============================
   WHAT'S ON LOGO (FRONT LAYER)
=============================== */

#whatsOn{
  position:absolute;
  left:-60px;
  top:-15px;
  z-index:3;
  height:100px;
}
	
/* ===============================
LOGO FLIP
=============================== */

.flip-out{
  animation:flipOut .5s forwards;
}

.flip-in{
  animation:flipIn .5s forwards;
}

@keyframes flipOut{
  0%{transform:rotateY(0deg);}
  100%{transform:rotateY(90deg);opacity:0;}
}

@keyframes flipIn{
  0%{transform:rotateY(-90deg);opacity:0;}
  100%{transform:rotateY(0deg);opacity:1;}
}

/* ===============================
   ANIMATIONS (UNCHANGED)
=============================== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{transform:translateX(-100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

@keyframes slideOut{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(-100%);opacity:0;}
}

</style>
</head>

<body>

<div id="banner">

  <!-- TEXT + LOGO -->
  <div id="content">

      <div id="text-wrapper">
          <div id="headline"></div>
          <div id="subline"></div>
      </div>

      <img id="whatsOn"
      src="https://totalmixcreative.github.io/graphics/whatson.png">

  </div>

</div>

<script>
    
let rotateTimeout = null;
let rotateLoop = null;
    
let lastTravelRun = 0;
    
// HARD RESET OF EXPIRED TRAVEL STATE
(function(){

  const state = JSON.parse(localStorage.getItem("travelState"));

  if(!state) return;

  const now = Date.now();
  const end = state.start + (state.duration * 1000);

  if(now > end){
    localStorage.removeItem("travelState");
  }

})();


/**************** CONFIG ****************/

const ENDPOINT_URL =
"https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";

const HOLD_DURATION = 6000;
const ANIMATION_DURATION = 600;
const TOTAL_DURATION = HOLD_DURATION + ANIMATION_DURATION;

/**************** STATE ****************/

let items = [];
let index = 0;
let rotationStarted = false;
let serverOffset = 0;


/**************** LOAD DATA ****************/

async function loadData(){

  try{

    const res = await fetch(
      ENDPOINT_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    items = data.lowerThird || [];

    if(items.length && !rotationStarted){

      rotationStarted = true;

      index =
        Math.floor((Date.now()+serverOffset)/TOTAL_DURATION)
        % items.length;

      rotate();

    }

  }catch(err){
    console.error(err);
  }

}


/**************** ROTATION ****************/

function rotate(){

  if(ltPaused || travelRunning) return;
  if(!items.length) return;

  const item = items[index];

  const wrapper =
    document.getElementById("text-wrapper");

  headline.textContent =
    item.headline || "";

  subline.textContent =
    item.subline || "";

  /* PROMO SCREEN SYNC */

  const timelineIndex =
    Math.floor((Date.now()+serverOffset)/TOTAL_DURATION);

  const imageIndex =
    Array.isArray(item.image)
    ? timelineIndex % item.image.length
    : 0;

  localStorage.setItem(
    "currentPromo",
    JSON.stringify({
      ...item,
      serverOffset,
      imageIndex
    })
  );

  wrapper.className = "";

  wrapper.classList.add("slide-in");

  rotateTimeout = setTimeout(()=>{
  wrapper.classList.remove("slide-in");
  wrapper.classList.add("slide-out");
}, HOLD_DURATION);

  rotateLoop = setTimeout(()=>{

  wrapper.classList.remove("slide-out");

  index =
    Math.floor((Date.now()+serverOffset)/TOTAL_DURATION)
    % items.length;

  rotate();

}, TOTAL_DURATION);

}

/* ============================
STATE
============================ */

let ltPaused = false;
let travelRunning = false;
let serverTimeOffset = 0;


/* ============================
LOGO CONTROL
============================ */

function showTravelLogo(){

  const logo = document.getElementById("whatsOn");

  logo.classList.remove("flip-in","flip-out");
  logo.classList.add("flip-out");

  setTimeout(()=>{

    logo.src =
      "https://totalmixcreative.github.io/graphics/travel.png";

    logo.classList.remove("flip-out");
    logo.classList.add("flip-in");

  },500);

}

function showWhatsOnLogo(){

  const logo = document.getElementById("whatsOn");

  logo.classList.remove("flip-in","flip-out");
  logo.classList.add("flip-out");

  setTimeout(()=>{

    logo.src =
      "https://totalmixcreative.github.io/graphics/whatson.png";

    logo.classList.remove("flip-out");
    logo.classList.add("flip-in");

  },500);

}


/* ============================
TEXT UPDATE
============================ */

function showTravelCountdown(headlineText, sublineText){

  const headline = document.getElementById("headline");
  const subline = document.getElementById("subline");

  headline.textContent = headlineText;
  subline.textContent = sublineText;

}


/* ============================
LOWER THIRD CONTROL
============================ */

function pauseLowerThird(){

  ltPaused = true;

  if(rotateTimeout){
    clearTimeout(rotateTimeout);
    rotateTimeout = null;
  }

  if(rotateLoop){
    clearTimeout(rotateLoop);
    rotateLoop = null;
  }

}

function resumeLowerThird(){

  ltPaused = false;

  rotate();

}


/* ============================
TRAVEL START
============================ */

function startTravel(){

  pauseLowerThird();
  showTravelLogo();

  let travelData;

  try{
    travelData =
      JSON.parse(localStorage.getItem("travelSlides")) || {};
  }catch(e){
    travelData = {};
  }

  const slides = travelData.slides || [];

  const duration =
    travelData.duration ||
    (slides.length * 15) ||
    30;

  console.log("Starting travel with duration:", duration);

  localStorage.setItem(
    "travelState",
    JSON.stringify({
      active: true,
      start: Date.now(),
      duration: duration
    })
  );

  travelRunning = true;

  startTravelCountdown(duration);

}
    
function startWeekendTravel(){

  pauseLowerThird();
  showTravelLogo();

  // 👇 flag weekend mode
  localStorage.setItem("travelMode", "weekend");

  const duration = 15;

  localStorage.setItem(
    "travelState",
    JSON.stringify({
      active: true,
      start: Date.now(),
      duration: duration
    })
  );

  travelRunning = true;

  startTravelCountdown(duration);

}


/* ============================
TRAVEL END
============================ */

function endTravel(){

  localStorage.removeItem("travelState");
  localStorage.removeItem("travelMode"); // 👈 ADD THIS

  setTimeout(()=>{

    showWhatsOnLogo();
    resumeLowerThird();

  },600);

}


/* ============================
TRAVEL COUNTDOWN
============================ */

function startTravelCountdown(duration){

  const now = new Date(Date.now() + serverTimeOffset);

  const hours = now.getHours();
  const minutesNow = now.getMinutes().toString().padStart(2,"0");
  const updateTime = `${hours}:${minutesNow}`;

  let remaining = duration;

  const timer = setInterval(()=>{

    const minutes = Math.floor(remaining/60);
    const seconds = remaining % 60;

    if(remaining <= 10){

      showTravelCountdown(
        `Latest Update at ${updateTime}`,
        "Next travel update in 30 minutes"
      );

    }else{

      showTravelCountdown(
        `Latest Update at ${updateTime}`,
        `${minutes}:${seconds.toString().padStart(2,"0")}`
      );

    }

    remaining--;

    if(remaining <= 0){

      clearInterval(timer);
      endTravel();
      travelRunning = false;

    }

  },1000);

}


/* ============================
TRAVEL SCHEDULER
============================ */

setTimeout(() => {
  setInterval(checkTravel,1000);
}, 5000); // wait 5 seconds after load

function checkTravel(){

  const now = new Date(Date.now() + serverTimeOffset);

  const minute = now.getMinutes();
  const second = now.getSeconds();

  const nowTime = Date.now();

const hour = now.getHours();

const day = now.getDay(); // 0 = Sunday, 6 = Saturday

if(
  (minute === 15 || minute === 45) &&
  second < 10 &&
  hour >= 6 && hour < 22 &&
  !travelRunning
){

  lastTravelRun = nowTime;
  travelRunning = true;

  const timelinePosition =
    (Date.now() + serverOffset) % TOTAL_DURATION;

  const delay = TOTAL_DURATION - timelinePosition;

  if(day === 0 || day === 6){
    setTimeout(startWeekendTravel, delay); // 👈 WEEKEND
  }else{
    setTimeout(startTravel, delay); // 👈 WEEKDAY
  }

}

}
	
loadData();
setInterval(loadData,120000);
    
window.addEventListener("load", () => {

  const day = new Date().getDay(); // 0 = Sun, 6 = Sat

  if(checkTravelState() && day >= 1 && day <= 5){
    startTravel();
  }else{
    localStorage.removeItem("travelState"); // clean stale data
    showWhatsOnLogo();
    resumeLowerThird();
  }

});
    
setInterval(() => {

  if(!checkTravelState() && travelRunning){
    travelRunning = false;
    showWhatsOnLogo();
    resumeLowerThird();
  }

}, 1000);

</script>

</body>
</html>
