<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carbon Lower Third</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:'Google Sans', Arial, Helvetica, sans-serif;
}

/* ===============================
   TOP BANNER
=============================== */

#banner{
  position:absolute;
  top:0;
  width:100%;
  height:220px;
  overflow:hidden;
}

/* ===============================
   CONTENT AREA
=============================== */

#content{
  position:absolute;
  top:40px;
  left:80px;
}

/* TEXT */

#text-wrapper{
  position:relative;
  z-index:2;
  color:white;

  margin-left:300px; /* ← PUSH TEXT RIGHT */
}

#headline{
  font-size:50px;
  font-weight:700;
  margin:0;
  line-height:1.1;
}

#subline{
  font-size:36px;
  margin-top:6px;
}

/* ===============================
   WHAT'S ON LOGO (FRONT LAYER)
=============================== */

#whatsOn{
  position:absolute;
  left:-60px;
  top:-15px;
  z-index:3;
  height:100px;
}
	
/* ===============================
LOGO FLIP
=============================== */

.flip-out{
  animation:flipOut .5s forwards;
}

.flip-in{
  animation:flipIn .5s forwards;
}

@keyframes flipOut{
  0%{transform:rotateY(0deg);}
  100%{transform:rotateY(90deg);opacity:0;}
}

@keyframes flipIn{
  0%{transform:rotateY(-90deg);opacity:0;}
  100%{transform:rotateY(0deg);opacity:1;}
}

/* ===============================
   ANIMATIONS (UNCHANGED)
=============================== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{transform:translateX(-100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

@keyframes slideOut{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(-100%);opacity:0;}
}

</style>
</head>

<body>

<div id="banner">

  <!-- TEXT + LOGO -->
  <div id="content">

      <div id="text-wrapper">
          <div id="headline"></div>
          <div id="subline"></div>
      </div>

      <img id="whatsOn"
      src="https://totalmixcreative.github.io/graphics/whatson.png">

  </div>

</div>

<script>

let serverTimeOffset = 0;

async function syncServerTime(){

  try{

    const res = await fetch(
      "https://timeapi.world/timezone/Europe/London"
    );

    const data = await res.json();

    const serverNow = new Date(data.datetime);
    const localNow = new Date();

    serverTimeOffset = serverNow - localNow;

  }catch(e){

    console.log("Server time sync failed");

  }

}

function now(){
  return new Date(Date.now() + serverTimeOffset);
}

/**************** CONFIG ****************/

const ENDPOINT_URL =
"https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";

const BASE =
"https://totalmixcreative.github.io/graphics/promos/";

const IMAGE_DURATION = 6000;
const ANIMATION_DURATION = 600;

/**************** STATE ****************/

let items = [];
let currentIndex = 0;
let rotationStarted = false;

/**************** LOAD DATA ****************/

async function loadData(){

  try{

    const res = await fetch(
      ENDPOINT_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    items = data.lowerThird || [];

  }catch(err){

    console.error(err);

  }

}

/**************** GET MEDIA DURATION ****************/

async function getItemDuration(item){

  return new Promise((resolve)=>{

    const file =
      Array.isArray(item.image)
      ? item.image[0]
      : item.image;

    if(!file){

      resolve(IMAGE_DURATION);
      return;

    }

    const ext =
      file.split(".").pop().toLowerCase();

    /* IMAGE */

    if(ext !== "mp4" && ext !== "webm"){

      resolve(IMAGE_DURATION);
      return;

    }

    /* VIDEO */

    const video =
      document.createElement("video");

    video.preload = "metadata";

    video.onloadedmetadata = ()=>{

      resolve(video.duration * 1000);

    };

    video.onerror = ()=>{

      resolve(IMAGE_DURATION);

    };

    video.src = BASE + file;

  });

}

/**************** PLAYLIST ENGINE ****************/

async function playRotation(){

  if(rotationStarted) return;

  rotationStarted = true;

  while(true){

    if(!items.length){

      await new Promise(r=>setTimeout(r,1000));
      continue;

    }

    const item = items[currentIndex];

    const wrapper =
      document.getElementById("text-wrapper");

    const headline =
      document.getElementById("headline");

    const subline =
      document.getElementById("subline");

    headline.textContent =
      item.headline || "";

    subline.textContent =
      item.subline || "";

    const imageIndex =
      Array.isArray(item.image)
      ? Math.floor(Math.random() * item.image.length)
      : 0;

    localStorage.setItem(
      "currentPromo",
      JSON.stringify({
        image:item.image,
        imageIndex:imageIndex,
        headline:item.headline,
        subline:item.subline,
        timestamp:Date.now()
      })
    );

    wrapper.classList.remove("slide-in");
    wrapper.classList.remove("slide-out");

    void wrapper.offsetWidth;

    wrapper.classList.add("slide-in");

    const duration =
      await getItemDuration(item);

    setTimeout(()=>{

      wrapper.classList.remove("slide-in");
      wrapper.classList.add("slide-out");

    }, duration - ANIMATION_DURATION);

    await new Promise(r=>
      setTimeout(r,duration)
    );

    currentIndex++;

    if(currentIndex >= items.length){

      currentIndex = 0;

    }

  }

}

/**************** INIT ****************/

async function init(){

  await syncServerTime();

  setInterval(syncServerTime,300000);

  await loadData();

  playRotation();

  setInterval(loadData,120000);

}

init();

</script>

</body>
</html>
