<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carbon Lower Third</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:'Google Sans', Arial, Helvetica, sans-serif;
}

/* ===============================
   TOP BANNER
=============================== */

#banner{
  position:absolute;
  top:0;
  width:100%;
  height:220px;
  overflow:hidden;
}

/* ===============================
   CONTENT AREA
=============================== */

#content{
  position:absolute;
  top:40px;
  left:80px;
}

/* TEXT */

#text-wrapper{
  position:relative;
  z-index:2;
  color:white;

  margin-left:300px; /* ← PUSH TEXT RIGHT */
}

#headline{
  font-size:50px;
  font-weight:700;
  margin:0;
  line-height:1.1;
}

#subline{
  font-size:36px;
  margin-top:6px;
}

/* ===============================
   WHAT'S ON LOGO (FRONT LAYER)
=============================== */

#whatsOn{
  position:absolute;
  left:-60px;
  top:-15px;
  z-index:3;
  height:100px;
}
	
/* ===============================
LOGO FLIP
=============================== */

.flip-out{
  animation:flipOut .5s forwards;
}

.flip-in{
  animation:flipIn .5s forwards;
}

@keyframes flipOut{
  0%{transform:rotateY(0deg);}
  100%{transform:rotateY(90deg);opacity:0;}
}

@keyframes flipIn{
  0%{transform:rotateY(-90deg);opacity:0;}
  100%{transform:rotateY(0deg);opacity:1;}
}

/* ===============================
   ANIMATIONS (UNCHANGED)
=============================== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{transform:translateX(-100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

@keyframes slideOut{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(-100%);opacity:0;}
}

</style>
</head>

<body>

<div id="banner">

  <!-- TEXT + LOGO -->
  <div id="content">

      <div id="text-wrapper">
          <div id="headline"></div>
          <div id="subline"></div>
      </div>

      <img id="whatsOn"
      src="https://totalmixcreative.github.io/graphics/whatson.png">

  </div>

</div>

<script>

let serverTimeOffset = 0;

async function syncServerTime(){

  try{

    const res = await fetch(
      "https://timeapi.world/timezone/Europe/London"
    );

    const data = await res.json();

    const serverNow = new Date(data.datetime);
    const localNow = new Date();

    serverTimeOffset = serverNow - localNow;

  }catch(e){

    console.log("Server time sync failed");

  }

}

function now(){
  return new Date(Date.now() + serverTimeOffset);
}

/**************** CONFIG ****************/

const ENDPOINT_URL =
"https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";

const HOLD_DURATION = 6000;
const ANIMATION_DURATION = 600;
const TOTAL_DURATION = HOLD_DURATION + ANIMATION_DURATION;
const MASTER_EPOCH =
new Date("2026-01-01T00:00:00Z").getTime();
    
function getElapsedTime(){
  return now().getTime() - MASTER_EPOCH;
}

/**************** STATE ****************/

let items = [];
let index = 0;
let rotationStarted = false;
let lastTimelineIndex = -1;
let animationStarted = false;
    
    
/**************** LOAD DATA ****************/

async function loadData(){

  try{

    const res = await fetch(
      ENDPOINT_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    items = data.lowerThird || [];

    if(items.length && !rotationStarted){

      rotationStarted = true;

index =
Math.floor(getElapsedTime() / TOTAL_DURATION)
% items.length;

    }

  }catch(err){
    console.error(err);
  }

}

/**************** ROTATION ****************/

function rotate(){

  if(!items.length) return;

  const timelineIndex =
  Math.floor(getElapsedTime()/TOTAL_DURATION);

index = timelineIndex % items.length;

if(
  timelineIndex === lastTimelineIndex &&
  animationStarted
)
  return;
    
lastTimelineIndex = timelineIndex;

const item = items[index];
    
animationStarted = true;

  const wrapper =
    document.getElementById("text-wrapper");

  const headline = document.getElementById("headline");
  const subline = document.getElementById("subline");

  headline.textContent =
    item.headline || "";

  subline.textContent =
    item.subline || "";

  /* PROMO SCREEN SYNC */

  const timelineIndex =
  Math.floor(getElapsedTime()/TOTAL_DURATION);

  const imageIndex =
  Array.isArray(item.image)
  ? timelineIndex % item.image.length
  : 0;

localStorage.setItem(
  "currentPromo",
  JSON.stringify({
    image: item.image,
    imageIndex: imageIndex,
    headline: item.headline,
    subline: item.subline,
    timestamp: getElapsedTime()
  })
);

wrapper.className = "";
wrapper.classList.add("slide-in");
    
}

/**************** POLLING ****************/

setInterval(()=>{

  if(!items.length) return;

  rotate();

  const wrapper =
    document.getElementById("text-wrapper");

  const elapsedInCycle =
    getElapsedTime() % TOTAL_DURATION;

  if(
    elapsedInCycle >= HOLD_DURATION &&
    !wrapper.classList.contains("slide-out")
  ){
    wrapper.classList.remove("slide-in");
    wrapper.classList.add("slide-out");
  }

},250);    
    
async function init(){

  await syncServerTime();

  /* resync every 5 mins */
  setInterval(syncServerTime,300000);

  await loadData();

  setInterval(loadData,120000);

}

init();

</script>

</body>
</html>
