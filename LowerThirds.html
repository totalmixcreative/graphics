<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carbon Lower Third</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:'Google Sans', Arial, Helvetica, sans-serif;
}

/* ===============================
   TOP BANNER
=============================== */

#banner{
  position:absolute;
  top:0;
  width:100%;
  height:220px;
  overflow:hidden;
}

/* ===============================
   CONTENT AREA
=============================== */

#content{
  position:absolute;
  top:40px;
  left:80px;
}

/* TEXT */

#text-wrapper{
  position:relative;
  z-index:2;
  color:white;

  margin-left:300px; /* ← PUSH TEXT RIGHT */
}

#headline{
  font-size:50px;
  font-weight:700;
  margin:0;
  line-height:1.1;
}

#subline{
  font-size:36px;
  margin-top:6px;
}

/* ===============================
   WHAT'S ON LOGO (FRONT LAYER)
=============================== */

#whatsOn{
  position:absolute;
  left:-60px;
  top:-15px;
  z-index:3;
  height:100px;
}
	
/* ===============================
LOGO FLIP
=============================== */

.flip-out{
  animation:flipOut .5s forwards;
}

.flip-in{
  animation:flipIn .5s forwards;
}

@keyframes flipOut{
  0%{transform:rotateY(0deg);}
  100%{transform:rotateY(90deg);opacity:0;}
}

@keyframes flipIn{
  0%{transform:rotateY(-90deg);opacity:0;}
  100%{transform:rotateY(0deg);opacity:1;}
}

/* ===============================
   ANIMATIONS (UNCHANGED)
=============================== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{transform:translateX(-100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

@keyframes slideOut{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(-100%);opacity:0;}
}

</style>
</head>

<body>

<div id="banner">

  <!-- TEXT + LOGO -->
  <div id="content">

      <div id="text-wrapper">
          <div id="headline"></div>
          <div id="subline"></div>
      </div>

      <img id="whatsOn"
      src="https://totalmixcreative.github.io/graphics/whatson.png">

  </div>

</div>

<script>

let serverTimeOffset = 0;

async function syncServerTime(){

  try{

    const res = await fetch(
      "https://timeapi.world/timezone/Europe/London"
    );

    const data = await res.json();

    const serverNow = new Date(data.datetime);
    const localNow = new Date();

    serverTimeOffset = serverNow - localNow;

  }catch(e){

    console.log("Server time sync failed");

  }

}

function now(){
  return new Date(Date.now() + serverTimeOffset);
}

/**************** CONFIG ****************/

const ENDPOINT_URL =
"https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";
	
const PS_FIXTURE_ENDPOINT =
"https://script.google.com/macros/s/AKfycbw2oJWXgOssax4eU_FHYk4QJx-NG5rMt-0qXWeUgCPyiqvyy898ysye65oCEPhFyv_wQw/exec";

const HOLD_DURATION = 10000;
const ANIMATION_DURATION = 600;
const TOTAL_DURATION = HOLD_DURATION + ANIMATION_DURATION;
const MASTER_EPOCH =
new Date("2026-01-01T00:00:00Z").getTime();

function getElapsedTime(){
  return now().getTime() - MASTER_EPOCH;
}

/**************** STATE ****************/

let items = [];
let lastTimelineIndex = -1;
let rotationStarted = false;
	
let psFootballFixtures = [];

let footballRotationIndex = 0;

let rotationSchedule = [];

/**************** NIGHT MODE STATE ****************/

let nightModeActive = false;

window.addEventListener("message",(e)=>{
	
	console.log("MESSAGE RECEIVED", e.data);

  if(e.data.type === "nightmode-on"){

    nightModeActive = true;

    loadData();

  }

  if(e.data.type === "nightmode-off"){

    nightModeActive = false;

    loadData();

  }

});
	
async function loadPSFootballFixtures(){

  try{

    const res =
      await fetch(
        PS_FIXTURE_ENDPOINT +
        "?t=" +
        Date.now()
      );

    const data =
      await res.json();

    psFootballFixtures =
      data.psFootballFixtures || [];

    console.log(
      "LT PS football fixtures:",
      psFootballFixtures
    );
	  
	  buildRotationSchedule();

  }catch(err){

    console.error(
      "LT PS football fixture fetch failed:",
      err
    );

  }

}
	
/**************** LOAD DATA ****************/

async function loadData(){

  try{

    const res = await fetch(
      ENDPOINT_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    items = data.lowerThird || [];
	  
/* =========================
   NIGHT MODE FILTER
========================= */

items = data.lowerThird || [];
	  
console.log(
  "NM ACTIVE:",
  nightModeActive
);

if(nightModeActive){

  items = items.filter(item => {

    const joined =
      Array.isArray(item.image)
      ? item.image.join(" ").toLowerCase()
      : item.image.toLowerCase();

    const blocked = [

      "food",
      "darts",
      "pool",
      "steak",
      "lunch",
      "fizz",
	  "sunday"

    ];

    const allowed = [

      "freepool"

    ];

    const isBlocked =
      blocked.some(tag =>
        joined.includes(tag)
      );

    const isAllowed =
      allowed.some(tag =>
        joined.includes(tag)
      );

    return !(isBlocked && !isAllowed);

  });

}
	  
	 buildRotationSchedule();

    if(items.length && !rotationStarted){

      rotationStarted = true;

    }

  }catch(err){
    console.error(err);
  }

}
	
function buildRotationSchedule(){

  rotationSchedule = [];

  /*
    NIGHT MODE:
    Keep the existing night-mode
    rotation exactly as it is.
  */

  if(nightModeActive){

    /*
      NIGHT MODE:
      Keep a fixed 4 normal promos → 2 football fixtures
      schedule.

      The promo content itself advances through the filtered
      Night Mode promo list each time the six-slot cycle repeats.
    */

    for(let i = 0; i < 4; i++){

      rotationSchedule.push({
        type: "promo",
        promoSlot: i
      });

    }

    if(psFootballFixtures.length){

      for(let j = 0; j < 2; j++){

        rotationSchedule.push({
          type: "football",
          footballSlot: j
        });

      }

    }

    return;

  }

  /*
    DAYTIME:
    4 normal promos
    then 2 football fixtures
  */

  let fixtureIndex = 0;

  for(
    let i = 0;
    i < items.length;
    i += 4
  ){

    const promoBlock =
      items.slice(i, i + 4);

    promoBlock.forEach(item => {

      rotationSchedule.push({
        type: "promo",
        item: item
      });

    });

    if(psFootballFixtures.length){

  for(let j = 0; j < 2; j++){

    rotationSchedule.push({

      type: "football",

      footballSlot: j

    });

  }

}

  }

}

/**************** ROTATION ****************/

function rotate(){

  if(!rotationSchedule.length) return;

  const timelineIndex =
    Math.floor(
      getElapsedTime() /
      TOTAL_DURATION
    );

  const newIndex =
    timelineIndex %
    rotationSchedule.length;

  if(newIndex === lastTimelineIndex)
    return;

  lastTimelineIndex = newIndex;

  const scheduleItem =
    rotationSchedule[newIndex];

  const wrapper =
    document.getElementById("text-wrapper");

  const headline =
    document.getElementById("headline");

  const subline =
    document.getElementById("subline");


  /* =========================
     FOOTBALL
  ========================= */

  if(scheduleItem.type === "football"){
	  
  if(!psFootballFixtures.length){
  return;
}

  const fixture =
    psFootballFixtures[
      footballRotationIndex %
      psFootballFixtures.length
    ];

  footballRotationIndex++;

  headline.textContent =
    "Live Football";

  subline.textContent =
    "Watch live football here";

  localStorage.setItem(
      "currentPromo",
      JSON.stringify({

        type:
          "football",

        fixture:
          fixture,

        timestamp:
          getElapsedTime()

      })
    );

  }


  /* =========================
     NORMAL PROMO
  ========================= */

  else{

    let item;

    if(
      nightModeActive &&
      scheduleItem.promoSlot !== undefined
    ){

      const cycleNumber =
        Math.floor(timelineIndex / rotationSchedule.length);

      const promoIndex =
        (
          cycleNumber * 4 +
          scheduleItem.promoSlot
        ) % items.length;

      item = items[promoIndex];

    }else{

      item = scheduleItem.item;

    }


    /* =========================
       F1
    ========================= */

    if(
      item.headline &&
      item.headline.includes("Grand Prix")
    ){

      headline.textContent =
        "Live Formula 1";

      subline.textContent =
        "Watch every lap live here";

    }

    else{

      headline.textContent =
        item.headline || "";

      subline.textContent =
        item.subline || "";

    }


    const imageIndex =
      Array.isArray(item.image)
      ? timelineIndex %
        item.image.length
      : 0;


    localStorage.setItem(
      "currentPromo",
      JSON.stringify({

        image:
          item.image,

        imageIndex:
          imageIndex,

        headline:
          item.headline,

        subline:
          item.subline,

        timestamp:
          getElapsedTime()

      })
    );

  }


  /* =========================
     ANIMATE LT
  ========================= */

  wrapper.classList.remove(
    "slide-in"
  );

  wrapper.classList.remove(
    "slide-out"
  );

  void wrapper.offsetWidth;

  wrapper.classList.add(
    "slide-in"
  );

}

/**************** POLLING ****************/

setInterval(()=>{

  if(!items.length) return;

  rotate();

  const wrapper =
    document.getElementById("text-wrapper");

  const elapsedInCycle =
    getElapsedTime() % TOTAL_DURATION;

  if(
    elapsedInCycle >= HOLD_DURATION &&
    !wrapper.classList.contains("slide-out")
  ){
    wrapper.classList.remove("slide-in");
    wrapper.classList.add("slide-out");
  }

},250);    
    
async function init(){

  await syncServerTime();

  /* resync every 5 mins */
  setInterval(syncServerTime,300000);

  await loadData();
await loadPSFootballFixtures();

setInterval(loadData,120000);
setInterval(loadPSFootballFixtures,120000);

}

init();

</script>

</body>
</html>
