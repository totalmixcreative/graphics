<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Carbon Lower Third</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:'Google Sans', Arial, Helvetica, sans-serif;
}

/* ===============================
   TOP BANNER
=============================== */

#banner{
  position:absolute;
  top:0;
  width:100%;
  height:220px;
  overflow:hidden;
}

/* ===============================
   CONTENT AREA
=============================== */

#content{
  position:absolute;
  top:40px;
  left:80px;
}

/* TEXT */

#text-wrapper{
  position:relative;
  z-index:2;
  color:white;

  margin-left:300px; /* ← PUSH TEXT RIGHT */
}

#headline{
  font-size:50px;
  font-weight:700;
  margin:0;
  line-height:1.1;
}

#subline{
  font-size:36px;
  margin-top:6px;
}

/* ===============================
   WHAT'S ON LOGO (FRONT LAYER)
=============================== */

#whatsOn{
  position:absolute;
  left:-60px;
  top:-15px;
  z-index:3;
  height:100px;
}
	
/* ===============================
LOGO FLIP
=============================== */

.flip-out{
  animation:flipOut .5s forwards;
}

.flip-in{
  animation:flipIn .5s forwards;
}

@keyframes flipOut{
  0%{transform:rotateY(0deg);}
  100%{transform:rotateY(90deg);opacity:0;}
}

@keyframes flipIn{
  0%{transform:rotateY(-90deg);opacity:0;}
  100%{transform:rotateY(0deg);opacity:1;}
}

/* ===============================
   ANIMATIONS (UNCHANGED)
=============================== */

.slide-in{
  animation:slideIn .6s ease forwards;
}

.slide-out{
  animation:slideOut .6s ease forwards;
}

@keyframes slideIn{
  from{transform:translateX(-100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

@keyframes slideOut{
  from{transform:translateX(0);opacity:1;}
  to{transform:translateX(-100%);opacity:0;}
}

</style>
</head>

<body>

<div id="banner">

  <!-- TEXT + LOGO -->
  <div id="content">

      <div id="text-wrapper">
          <div id="headline"></div>
          <div id="subline"></div>
      </div>

      <img id="whatsOn"
      src="https://totalmixcreative.github.io/graphics/whatson.png">

  </div>

</div>

<script>

let rotateTimeout = null;
let rotateLoop = null;

/**************** CONFIG ****************/

const ENDPOINT_URL =
"https://script.google.com/macros/s/AKfycbyz-izL1cT1FGGIXDStm32Fxw_bGfmV_bxrS29J2tlGaUdJytmlZbVDWmlevQJmGI5D/exec";

const HOLD_DURATION = 6000;
const ANIMATION_DURATION = 600;
const TOTAL_DURATION = HOLD_DURATION + ANIMATION_DURATION;

/**************** STATE ****************/

let items = [];
let index = 0;
let rotationStarted = false;
let serverOffset = 0;

/**************** LOAD DATA ****************/

async function loadData(){

  try{

    const res = await fetch(
      ENDPOINT_URL + "?t=" + Date.now()
    );

    const data = await res.json();

    items = data.lowerThird || [];

    if(items.length && !rotationStarted){

      rotationStarted = true;

      index =
        Math.floor((Date.now()+serverOffset)/TOTAL_DURATION)
        % items.length;

      rotate();

    }

  }catch(err){
    console.error(err);
  }

}

/**************** ROTATION ****************/

function rotate(){

  if(!items.length) return;

  const item = items[index];

  const wrapper =
    document.getElementById("text-wrapper");

  const headline = document.getElementById("headline");
  const subline = document.getElementById("subline");

  headline.textContent =
    item.headline || "";

  subline.textContent =
    item.subline || "";

  /* PROMO SCREEN SYNC */

  const timelineIndex =
    Math.floor((Date.now()+serverOffset)/TOTAL_DURATION);

  const imageIndex =
    Array.isArray(item.image)
    ? timelineIndex % item.image.length
    : 0;

  localStorage.setItem(
    "currentPromo",
    JSON.stringify({
      ...item,
      serverOffset,
      imageIndex
    })
  );

  wrapper.className = "";
  wrapper.classList.add("slide-in");

  rotateTimeout = setTimeout(()=>{
    wrapper.classList.remove("slide-in");
    wrapper.classList.add("slide-out");
  }, HOLD_DURATION);

  rotateLoop = setTimeout(()=>{

    wrapper.classList.remove("slide-out");

    index =
      Math.floor((Date.now()+serverOffset)/TOTAL_DURATION)
      % items.length;

    rotate();

  }, TOTAL_DURATION);

}

/**************** INIT ****************/

window.addEventListener("load", () => {

  // ensure no leftover travel state anywhere
  localStorage.removeItem("travelState");
  localStorage.removeItem("travelMode");

  rotate();

});

/**************** POLLING ****************/

loadData();
setInterval(loadData,120000);

</script>

</body>
</html>
