<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preload" href="Robuck-Regular.otf" as="font" type="font/otf" crossorigin>
<meta charset="UTF-8">
<title>Nights Stinger System</title>

<style>
body {
  margin: 0;
  background: transparent;
  overflow: hidden;
}

@font-face {
  font-family: 'Robuck';
  src: url('Robuck-Regular.otf') format('opentype');
}

#wrapper {
  position: fixed;
  inset: 0;
  opacity: 0;
  pointer-events:none;
}

.show {

  opacity:1;

  animation:
    stingerIn 0.7s cubic-bezier(0.2,0.8,0.2,1) forwards;

}

.hide {

  opacity:0;

  animation:
    stingerOut 0.6s ease forwards;

}

@keyframes stingerIn {
  0% { opacity: 0; transform: scale(0.8) translateY(60px); }
  60% { opacity: 1; transform: scale(1.05) translateY(-10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes stingerOut {
  0% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  100% {
    opacity: 0;
    transform: scale(1.03) translateY(-20px);
  }
}
</style>
</head>

<body>

<div id="wrapper">
<svg width="100%" height="100%" viewBox="0 0 1920 1080">

<defs>

<linearGradient id="grad">
  <animate attributeName="x1" values="0%;100%;0%" dur="20s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="100%;0%;100%" dur="20s" repeatCount="indefinite"/>
  <stop id="gradStart" offset="0%" stop-color="#ff2a8a"/>
  <stop id="gradEnd" offset="100%" stop-color="#ff7a18"/>
</linearGradient>

    x="50%" y="50%"

  </text>

  CARBON NIGHTS
</tspan>

</text>
</mask>

<rect id="mainRect"
      width="100%"

</html>
